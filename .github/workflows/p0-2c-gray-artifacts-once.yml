name: P0-2C Gray Artifacts Once

on:
  push:
    branches:
      - fix/p0-2c-reality-multi-user
    paths:
      - .github/workflows/p0-2c-gray-artifacts-once.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: p0-2c-gray-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forwardx

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify P0-2C code gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:versions
          pnpm exec tsc --noEmit
          node --import tsx --test \
            server/agentProtocolTrafficAccounting.test.ts \
            server/agentProtocolTrafficRoute.test.ts \
            server/protocolXrayPlan.test.ts \
            server/protocolXrayMigration.test.ts \
            server/protocolXrayRuntimeAction.test.ts
          pnpm build
          (
            cd agent
            go test ./...
            go vet ./...
          )
          grep -q 'AGENT_VERSION = "2.2.196"' shared/versions.ts
          test -f agent/xray_traffic_reporter.go
          grep -q 'protocolStats' agent/xray_traffic_reporter.go
          grep -q 'parseXrayStatsAPIListen' agent/xray_traffic_reporter.go

  agent:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: agent/go.sum

      - name: Build isolated gray Agent binaries
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE "s/.*AGENT_VERSION[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" shared/versions.ts | head -n1)"
          VERSION="${VERSION#v}"
          test "$VERSION" = "2.2.196"
          mkdir -p dist/p0-2c-gray-agent
          (
            cd agent
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" \
              -o ../dist/p0-2c-gray-agent/forwardx-agent-p0-2c-gray-linux-amd64 .
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" \
              -o ../dist/p0-2c-gray-agent/forwardx-agent-p0-2c-gray-linux-arm64 .
          )
          sha256sum dist/p0-2c-gray-agent/forwardx-agent-p0-2c-gray-linux-* \
            > dist/p0-2c-gray-agent/SHA256SUMS
          chmod +x dist/p0-2c-gray-agent/forwardx-agent-p0-2c-gray-linux-amd64
          dist/p0-2c-gray-agent/forwardx-agent-p0-2c-gray-linux-amd64 -h >/tmp/agent-help.txt 2>&1 || true
          grep -q -- '-config' /tmp/agent-help.txt
          cat dist/p0-2c-gray-agent/SHA256SUMS

      - name: Publish isolated Agent prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="p0-2c-agent-gray-${GITHUB_SHA:0:8}"
          TITLE="P0-2C Reality Gray Agent ${GITHUB_SHA:0:8}"
          NOTES="Isolated P0-2C Reality/Xray multi-user gray Agent for PR #41. Source commit: ${GITHUB_SHA}. Agent version: 2.2.196. Not a production release."
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            dist/p0-2c-gray-agent/forwardx-agent-p0-2c-gray-linux-amd64 \
            dist/p0-2c-gray-agent/forwardx-agent-p0-2c-gray-linux-arm64 \
            dist/p0-2c-gray-agent/SHA256SUMS
          echo "P0_2C_AGENT_GRAY_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Published isolated Agent prerelease: $TAG"

  image-build:
    needs: verify
    name: Image ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            node_arch: x64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            node_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push gray image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=ForwardX P0-2C Gray
            org.opencontainers.image.description=ForwardX P0-2C Reality/Xray multi-user gray panel
            org.opencontainers.image.version=2.3.284-p0-2c-gray
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            FORWARDX_VERSION=2.3.284
          cache-from: type=gha,scope=p0-2c-gray-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=p0-2c-gray-${{ matrix.arch }}

      - name: Verify native image runtime
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}@${DIGEST}"
          docker run --rm \
            --platform "${PLATFORM}" \
            --entrypoint node \
            -e "EXPECTED_NODE_ARCH=${EXPECTED_NODE_ARCH}" \
            -e "EXPECTED_VERSION=2.3.284" \
            "${IMAGE_NAME}@${DIGEST}" \
            -e '
              const Database = require("better-sqlite3");
              const db = new Database(":memory:");
              const value = db.prepare("select 1 as value").pluck().get();
              db.close();
              if (value !== 1) throw new Error("SQLite runtime check failed");
              if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error(`Expected ${process.env.EXPECTED_NODE_ARCH}, got ${process.arch}`);
              if (process.env.FORWARDX_IMAGE_VERSION !== process.env.EXPECTED_VERSION) throw new Error(`Expected ${process.env.EXPECTED_VERSION}, got ${process.env.FORWARDX_IMAGE_VERSION}`);
            '

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: p0-2c-gray-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    needs:
      - verify
      - image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: p0-2c-gray-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Publish isolated multi-platform gray image
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)
          test "${#digest_files[@]}" -eq 2
          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "$digest_file")")
          done
          PRIMARY_TAG="${IMAGE_NAME}:p0-2c-gray-${GITHUB_SHA:0:8}"
          SECONDARY_TAG="${IMAGE_NAME}:p0-2c-sha-${GITHUB_SHA:0:12}"
          docker buildx imagetools create \
            -t "$PRIMARY_TAG" \
            -t "$SECONDARY_TAG" \
            "${sources[@]}"
          manifest_json="$(docker buildx imagetools inspect "$PRIMARY_TAG" --raw)"
          echo "$manifest_json" | jq -e '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1
            and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1
          '
          primary_digest="$(docker buildx imagetools inspect "$PRIMARY_TAG" | awk '$1 == "Digest:" { digest=$2 } END { print digest }')"
          secondary_digest="$(docker buildx imagetools inspect "$SECONDARY_TAG" | awk '$1 == "Digest:" { digest=$2 } END { print digest }')"
          test -n "$primary_digest"
          test "$primary_digest" = "$secondary_digest"
          echo "P0-2C gray image: $PRIMARY_TAG@$primary_digest"

  cleanup:
    needs:
      - verify
      - agent
      - image-build
      - image-merge
    if: ${{ always() && needs.verify.result == 'success' && needs.agent.result == 'success' && needs.image-build.result == 'success' && needs.image-merge.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-2c-reality-multi-user
          fetch-depth: 0

      - name: Remove one-shot gray artifact workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p0-2c-gray-artifacts-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/p0-2c-gray-artifacts-once.yml
          git commit -m "ci(p0-2c): remove gray artifact one-shot"
          git push origin HEAD:fix/p0-2c-reality-multi-user
