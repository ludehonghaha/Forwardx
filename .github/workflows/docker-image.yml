name: Docker Image

on:
  workflow_call:
    inputs:
      publish_release:
        description: Publish immutable version and latest tags
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "agent/**"
      - "forwardx-fxp/**"
      - ".github/workflows/release-agent.yml"
      - "scripts/build-agent-release.sh"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forwardx

permissions:
  contents: read
  packages: write

concurrency:
  group: forwardx-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package.outputs.version }}
      should_build: ${{ steps.decision.outputs.should_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether this workflow should build
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          VERSION: ${{ steps.package.outputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          should_build=true
          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "${PUBLISH_RELEASE:-false}" != "true" ]; then
            if [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              previous_version="$(git show "${BEFORE_SHA}:package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(s ? JSON.parse(s).version : ""))')"
              if [ -n "$previous_version" ] && [ "$previous_version" != "$VERSION" ]; then
                should_build=false
                echo "Panel version changed ${previous_version} -> ${VERSION}; skip duplicate main image and let Release Panel publish the formal image once."
              fi
            fi
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            node_arch: x64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            node_arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=ForwardX
            org.opencontainers.image.description=ForwardX port forwarding panel
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.forwardx.version=${{ needs.prepare.outputs.version }}
          build-args: |
            FORWARDX_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=forwardx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=forwardx-${{ matrix.arch }}

      - name: Verify native runtime
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}@${DIGEST}"
          docker run --rm \
            --platform "${PLATFORM}" \
            --entrypoint node \
            -e "EXPECTED_NODE_ARCH=${EXPECTED_NODE_ARCH}" \
            -e "EXPECTED_VERSION=${VERSION}" \
            "${IMAGE_NAME}@${DIGEST}" \
            -e '
              const Database = require("better-sqlite3");
              const db = new Database(":memory:");
              const value = db.prepare("select 1 as value").pluck().get();
              db.close();
              if (value !== 1) throw new Error("SQLite runtime check failed");
              if (process.arch !== process.env.EXPECTED_NODE_ARCH) {
                throw new Error(`Expected ${process.env.EXPECTED_NODE_ARCH}, got ${process.arch}`);
              }
              if (process.env.FORWARDX_IMAGE_VERSION !== process.env.EXPECTED_VERSION) {
                throw new Error(`Expected version ${process.env.EXPECTED_VERSION}, got ${process.env.FORWARDX_IMAGE_VERSION}`);
              }
            '

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: forwardx-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: forwardx-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create and verify multi-platform image
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "::error::Expected 2 platform digests, found ${#digest_files[@]}"
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done

          if [[ "$GITHUB_REF" == refs/tags/* ]] || [ "${PUBLISH_RELEASE:-false}" = "true" ]; then
            primary_tag="${IMAGE_NAME}:v${VERSION}"
            secondary_tag="${IMAGE_NAME}:latest"
            publish_mode="release"
          else
            primary_tag="${IMAGE_NAME}:main"
            secondary_tag="${IMAGE_NAME}:sha-${GITHUB_SHA:0:12}"
            publish_mode="main"
          fi

          docker buildx imagetools create \
            -t "${primary_tag}" \
            -t "${secondary_tag}" \
            "${sources[@]}"

          manifest_json="$(docker buildx imagetools inspect "${primary_tag}" --raw)"
          echo "${manifest_json}" | jq -e '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1
            and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1
          '

          primary_digest="$(docker buildx imagetools inspect "${primary_tag}" | awk '$1 == "Digest:" { digest=$2 } END { print digest }')"
          secondary_digest="$(docker buildx imagetools inspect "${secondary_tag}" | awk '$1 == "Digest:" { digest=$2 } END { print digest }')"
          test -n "${primary_digest}"
          test "${primary_digest}" = "${secondary_digest}"
          echo "Published ${publish_mode} image ${primary_tag} and ${secondary_tag} at ${primary_digest}"
