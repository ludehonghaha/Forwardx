name: ChatGPT P0-2A Verify

on:
  push:
    branches:
      - chatgpt/p0-2a-carrier-probes
    paths:
      - .github/workflows/chatgpt-p0-2a-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/p0-2a-carrier-probes
          fetch-depth: 0

      - name: Apply compatibility and UX refinements
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function patch(file, from, to, label, all = false) {
            let source = fs.readFileSync(file, 'utf8');
            if (!source.includes(from)) throw new Error(`missing patch anchor: ${label}`);
            source = all ? source.split(from).join(to) : source.replace(from, to);
            fs.writeFileSync(file, source);
          }

          // Metadata validation/defaulting belongs in the repository so update callers
          // that omit the new fields keep the existing carrier metadata.
          patch(
            'server/routers/hosts.ts',
            'import { normalizeHostProbeMetadata } from "../../shared/hostProbeMetadata";\n',
            '',
            'router metadata import',
          );
          patch(
            'server/routers/hosts.ts',
            '  const metadata = normalizeHostProbeMetadata(input);\n  const hostIds =',
            '  const hostIds =',
            'router metadata normalization',
          );
          patch(
            'server/routers/hosts.ts',
            '  return {\n    ...input,\n    ...metadata,\n    targetPort:',
            '  return {\n    ...input,\n    targetPort:',
            'router metadata spread',
          );

          // Carrier configuration is a fixed view: default to 60s and do not let a
          // target accidentally change into a custom probe while editing.
          patch(
            'client/src/components/hosts/HostProbeServiceManager.tsx',
            '  defaultProbeKind?: HostProbeKind;\n};',
            '  defaultProbeKind?: HostProbeKind;\n  defaultCarrier?: HostProbeCarrier | null;\n};',
            'manager defaultCarrier prop',
          );
          patch(
            'client/src/components/hosts/HostProbeServiceManager.tsx',
            '  defaultProbeKind = "custom",\n}: HostProbeServiceManagerProps) {',
            '  defaultProbeKind = "custom",\n  defaultCarrier = null,\n}: HostProbeServiceManagerProps) {',
            'manager defaultCarrier arg',
          );
          patch(
            'client/src/components/hosts/HostProbeServiceManager.tsx',
            '  const [form, setForm] = useState<ServiceForm>(defaultForm);\n  const [internalViewMode,',
            '  const [form, setForm] = useState<ServiceForm>(defaultForm);\n  const newServiceForm = useMemo<ServiceForm>(() => ({\n    ...defaultForm,\n    probeKind: defaultProbeKind,\n    carrier: defaultProbeKind === "china_carrier" ? defaultCarrier : null,\n    intervalSeconds: defaultProbeKind === "china_carrier" ? 60 : defaultForm.intervalSeconds,\n  }), [defaultCarrier, defaultProbeKind]);\n  const [internalViewMode,',
            'manager new service defaults',
          );
          patch(
            'client/src/components/hosts/HostProbeServiceManager.tsx',
            'setForm({ ...defaultForm, probeKind: defaultProbeKind });',
            'setForm(newServiceForm);',
            'manager reset forms',
            true,
          );
          patch(
            'client/src/components/hosts/HostProbeServiceManager.tsx',
            '  }, [createSignal, onCreateSignalHandled]);',
            '  }, [createSignal, newServiceForm, onCreateSignalHandled]);',
            'manager create effect deps',
          );
          patch(
            'client/src/components/hosts/HostProbeServiceManager.tsx',
            '                <Select\n                  value={form.probeKind}',
            '                <Select\n                  value={form.probeKind}\n                  disabled={probeKindFilter !== "all"}',
            'manager fixed kind select',
          );
          patch(
            'client/src/components/hosts/HostProbeServiceManager.tsx',
            '    service?.targetPort,\n    serviceTarget(service),\n    status,',
            '    service?.targetPort,\n    serviceTarget(service),\n    service?.probeKind,\n    service?.carrier,\n    service?.carrier ? HOST_PROBE_CARRIER_LABELS[service.carrier as HostProbeCarrier] : null,\n    service?.region,\n    status,',
            'manager carrier search metadata',
          );

          // Clicking one carrier target should open that target's 24H history, not all
          // unrelated custom/other-carrier services on the same host.
          patch(
            'client/src/components/hosts/AdvancedProbePanel.tsx',
            '  type ChinaCarrierProbeOverviewItem,\n} from "@/components/hosts/ChinaCarrierProbeOverview";',
            '  type ChinaCarrierProbeOverviewItem,\n} from "@/components/hosts/ChinaCarrierProbeOverview";\nimport type { HostProbeCarrier } from "@shared/hostProbeMetadata";',
            'advanced panel carrier type import',
          );
          patch(
            'client/src/components/hosts/AdvancedProbePanel.tsx',
            '  const [historyHostId, setHistoryHostId] = useState<number | null>(null);',
            '  const [historyHostId, setHistoryHostId] = useState<number | null>(null);\n  const [historyServiceId, setHistoryServiceId] = useState<number | null>(null);\n  const [carrierCreateSignal, setCarrierCreateSignal] = useState(0);\n  const [defaultCarrier, setDefaultCarrier] = useState<HostProbeCarrier | null>(null);',
            'advanced panel state',
          );
          patch(
            'client/src/components/hosts/AdvancedProbePanel.tsx',
            '  const openHistory = (host: ChinaCarrierProbeOverviewHost, _item: ChinaCarrierProbeOverviewItem) => {\n    setHistoryHostId(Number(host.hostId));\n  };',
            '  const historyServices = useMemo(\n    () => (services as any[]).filter((service) => Number(service.id) === historyServiceId),\n    [historyServiceId, services],\n  );\n\n  const openHistory = (host: ChinaCarrierProbeOverviewHost, item: ChinaCarrierProbeOverviewItem) => {\n    setHistoryHostId(Number(host.hostId));\n    setHistoryServiceId(Number(item.serviceId));\n  };\n\n  const createCarrierTarget = (carrier: HostProbeCarrier) => {\n    setDefaultCarrier(carrier);\n    setCarrierCreateSignal((value) => value + 1);\n  };',
            'advanced panel focused history and carrier create',
          );
          patch(
            'client/src/components/hosts/AdvancedProbePanel.tsx',
            '            onOpenHistory={openHistory}\n          />',
            '            onOpenHistory={openHistory}\n            onCreateCarrier={createCarrierTarget}\n          />',
            'advanced panel overview create handler',
          );
          patch(
            'client/src/components/hosts/AdvancedProbePanel.tsx',
            '              createSignal={createSignal}\n              onCreateSignalHandled={onCreateSignalHandled}',
            '              createSignal={createSignal > 0 ? createSignal : carrierCreateSignal}\n              onCreateSignalHandled={() => { if (createSignal > 0) onCreateSignalHandled(); }}',
            'advanced panel carrier create signal',
          );
          patch(
            'client/src/components/hosts/AdvancedProbePanel.tsx',
            '              defaultProbeKind="china_carrier"\n            />',
            '              defaultProbeKind="china_carrier"\n              defaultCarrier={defaultCarrier}\n            />',
            'advanced panel default carrier',
          );
          patch(
            'client/src/components/hosts/AdvancedProbePanel.tsx',
            '        onOpenChange={(open) => !open && setHistoryHostId(null)}\n        host={historyHost}\n        services={services as any[]}',
            '        onOpenChange={(open) => {\n          if (!open) {\n            setHistoryHostId(null);\n            setHistoryServiceId(null);\n          }\n        }}\n        host={historyHost}\n        services={historyServices}',
            'advanced panel focused history services',
          );

          // Add a regression for repository updates that omit all new metadata fields.
          patch(
            'server/hostProbeCarrierIntegration.test.ts',
            '      assert.equal(shanghai.region, "Shanghai");\n\n      const tasks =',
            '      assert.equal(shanghai.region, "Shanghai");\n\n      await probes.updateHostProbeService(shanghaiId, {\n        name: "CM Shanghai renamed",\n        method: "ping",\n        targetIp: "cm-sh.example.test",\n        hostScope: "all",\n        intervalSeconds: 60,\n        isEnabled: true,\n      });\n      const preservedMetadata = await probes.getHostProbeServiceById(shanghaiId);\n      assert.equal(preservedMetadata.probeKind, "china_carrier");\n      assert.equal(preservedMetadata.carrier, "cm");\n      assert.equal(preservedMetadata.region, "Shanghai");\n\n      const tasks =',
            'integration metadata-preserving update',
          );
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify carrier integration
        run: |
          node --import tsx --test server/hostProbeMetadata.test.ts server/hostProbeCarrierIntegration.test.ts
          pnpm exec tsc --noEmit
          pnpm test:server
          pnpm build

      - name: Commit verified refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers/hosts.ts client/src/components/hosts/HostProbeServiceManager.tsx client/src/components/hosts/AdvancedProbePanel.tsx server/hostProbeCarrierIntegration.test.ts
          if git diff --cached --quiet; then
            echo "No refinement changes to commit"
            exit 0
          fi
          git commit -m "test(probes): lock carrier compatibility and focused history"
          git push origin HEAD:chatgpt/p0-2a-carrier-probes
