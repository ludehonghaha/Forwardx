name: PR76 Gray Image

on:
  push:
    branches:
      - feat/probe-carrier-dashboard-layout
    paths:
      - "client/**"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pr76-gray-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forwardx
  IMAGE_TAG: pr76-probe-ui-gray

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push gray image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=ForwardX PR76 gray
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=2.3.293-pr76-gray
          build-args: |
            FORWARDX_VERSION=2.3.293
          cache-from: type=gha,scope=pr76-gray-amd64
          cache-to: type=gha,mode=max,scope=pr76-gray-amd64

      - name: Verify image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
          docker run --rm --entrypoint node "${IMAGE_NAME}:${IMAGE_TAG}" -e '
            const Database = require("better-sqlite3");
            const db = new Database(":memory:");
            if (db.prepare("select 1").pluck().get() !== 1) process.exit(1);
            db.close();
            console.log("PR76 gray image runtime OK");
          '
