name: P0-2C Wire Xray Agent Runtime Once

on:
  push:
    branches:
      - fix/p0-2c-reality-multi-user
    paths:
      - .github/workflows/p0-2c-wire-xray-agent-runtime-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/p0-2c-reality-multi-user
          fetch-depth: 0

      - name: Apply focused Agent runtime recognition patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('agent/main.go')
          text = path.read_text()

          replacements = [
              (
                  'service constant',
                  'const mihomoServiceName = "forwardx-mihomo"\n',
                  'const mihomoServiceName = "forwardx-mihomo"\nconst xrayServiceName = "forwardx-xray"\n',
              ),
              (
                  'config constant',
                  'const mihomoConfigPath = "/etc/forwardx/mihomo/config.yaml"\n',
                  'const mihomoConfigPath = "/etc/forwardx/mihomo/config.yaml"\nconst xrayConfigPath = "/etc/forwardx/xray/config.json"\n',
              ),
              (
                  'local readiness config',
                  '\t\t{mieruConfigPath, mieruServiceName, "mieru"},\n\t\t{mihomoConfigPath, mihomoServiceName, "mihomo"},\n',
                  '\t\t{mieruConfigPath, mieruServiceName, "mieru"},\n\t\t{mihomoConfigPath, mihomoServiceName, "mihomo"},\n\t\t{xrayConfigPath, xrayServiceName, "xray"},\n',
              ),
              (
                  'local readiness parser',
                  '\t\t} else if cfg.kind == "mihomo" {\n\t\t\tlistens, ok = readMihomoRuntimeServiceListens(cfg.path)\n\t\t} else {\n',
                  '\t\t} else if cfg.kind == "mihomo" {\n\t\t\tlistens, ok = readMihomoRuntimeServiceListens(cfg.path)\n\t\t} else if cfg.kind == "xray" {\n\t\t\tlistens, ok = readXrayRuntimeServiceListens(cfg.path)\n\t\t} else {\n',
              ),
              (
                  'managed config parser',
                  '\tif strings.Contains(strings.ToLower(spec.ServiceName), "mihomo") || strings.Contains(strings.ToLower(path), "/mihomo/") {\n\t\treturn readMihomoRuntimeServiceListens(path)\n\t}\n\tif strings.HasSuffix(strings.ToLower(path), ".json") {\n',
                  '\tif strings.Contains(strings.ToLower(spec.ServiceName), "mihomo") || strings.Contains(strings.ToLower(path), "/mihomo/") {\n\t\treturn readMihomoRuntimeServiceListens(path)\n\t}\n\tif strings.Contains(strings.ToLower(spec.ServiceName), "xray") || strings.Contains(strings.ToLower(path), "/xray/") {\n\t\treturn readXrayRuntimeServiceListens(path)\n\t}\n\tif strings.HasSuffix(strings.ToLower(path), ".json") {\n',
              ),
              (
                  'runtime action service switch',
                  '\tcase "mihomo-runtime-sync":\n\t\tservices = requiredMihomoRuntimeServicesFromLocalConfig()\n',
                  '\tcase "mihomo-runtime-sync":\n\t\tservices = requiredMihomoRuntimeServicesFromLocalConfig()\n\tcase "xray-runtime-sync":\n\t\tservices = requiredXrayRuntimeServicesFromLocalConfig()\n',
              ),
              (
                  'required runtime service aggregate',
                  '\tservices = append(services, requiredMieruRuntimeServicesFromLocalConfig()...)\n\tservices = append(services, requiredMihomoRuntimeServicesFromLocalConfig()...)\n',
                  '\tservices = append(services, requiredMieruRuntimeServicesFromLocalConfig()...)\n\tservices = append(services, requiredMihomoRuntimeServicesFromLocalConfig()...)\n\tservices = append(services, requiredXrayRuntimeServicesFromLocalConfig()...)\n',
              ),
          ]

          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          anchor = 'func requiredMihomoRuntimeServicesFromLocalConfig() []string {\n\tlistens, ok := readMihomoRuntimeServiceListens(mihomoConfigPath)\n\tif ok && len(listens) > 0 {\n\t\treturn []string{mihomoServiceName}\n\t}\n\treturn nil\n}\n'
          addition = anchor + '\nfunc requiredXrayRuntimeServicesFromLocalConfig() []string {\n\tlistens, ok := readXrayRuntimeServiceListens(xrayConfigPath)\n\tif ok && len(listens) > 0 {\n\t\treturn []string{xrayServiceName}\n\t}\n\treturn nil\n}\n'
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'required Xray service helper: expected exactly 1 match, found {count}')
          text = text.replace(anchor, addition, 1)

          path.write_text(text)
          PY

          gofmt -w agent/main.go
          git diff --check
          git diff --stat
          git diff -- agent/main.go | sed -n '1,260p'

      - name: Verify Agent
        shell: bash
        run: |
          set -euo pipefail
          cd agent
          go test ./...
          go vet ./...

      - name: Commit focused patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p0-2c-wire-xray-agent-runtime-once.yml
          git add agent/main.go
          git commit -m 'feat(agent): recognize Xray managed runtime'
          git push origin HEAD:fix/p0-2c-reality-multi-user
