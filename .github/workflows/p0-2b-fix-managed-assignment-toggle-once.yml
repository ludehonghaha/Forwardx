name: P0-2B Fix Managed Assignment Toggle Once

on:
  push:
    branches:
      - fix/p0-2b-mieru-multi-user
    paths:
      - .github/workflows/p0-2b-fix-managed-assignment-toggle-once.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/p0-2b-mieru-multi-user
          fetch-depth: 0

      - name: Apply focused UI fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/ProtocolAccess.tsx')
          text = path.read_text()

          old_save = "\n".join([
              '      credential: assignmentEndpoint.protocol === "mieru"',
              '        ? (assignmentUsername || assignmentPassword ? { username: assignmentUsername.trim(), password: assignmentPassword } : {})',
              '        : (assignmentPassword ? { password: assignmentPassword } : {}),',
          ])
          new_save = "\n".join([
              '      credential: assignmentEndpoint.runtimeMode === "managed" && assignmentEndpoint.protocol === "mieru"',
              '        ? {}',
              '        : assignmentEndpoint.protocol === "mieru"',
              '          ? (assignmentUsername || assignmentPassword ? { username: assignmentUsername.trim(), password: assignmentPassword } : {})',
              '          : (assignmentPassword ? { password: assignmentPassword } : {}),',
          ])

          old_toggle = "\n".join([
              '      credential: parseProtocolAccessConfig(assignment.access?.credentialJson),',
              '      isEnabled,',
          ])
          new_toggle = "\n".join([
              '      credential: assignmentEndpoint.runtimeMode === "managed" && assignmentEndpoint.protocol === "mieru"',
              '        ? {}',
              '        : parseProtocolAccessConfig(assignment.access?.credentialJson),',
              '      isEnabled,',
          ])

          old_help = '托管端点固定使用共享用户名和密码，用户分配只控制订阅权限。'
          new_help = '托管 Mieru 的独立凭据由 ForwardX 自动管理；用户分配这里只控制接入权限。'

          for label, old, new in [
              ('saveAssignment', old_save, new_save),
              ('toggleAssignment', old_toggle, new_toggle),
              ('managed help text', old_help, new_help),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- client/src/pages/ProtocolAccess.tsx

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify panel build and protocol tests
        run: |
          pnpm build
          pnpm test:protocol-access

      - name: Commit focused fix and remove one-shot workflow
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p0-2b-fix-managed-assignment-toggle-once.yml
          git add client/src/pages/ProtocolAccess.tsx
          git commit -m 'fix(ui): allow managed Mieru assignment toggles'
          git push origin HEAD:fix/p0-2b-mieru-multi-user
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch gray Docker build for patched head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/docker-image.yml/dispatches \
            -d '{"ref":"fix/p0-2b-mieru-multi-user"}'
          echo "Patched head: ${{ steps.commit.outputs.sha }}"