name: Temporary Dispatch Panel v2.3.294

on:
  push:
    branches:
      - release/panel-v2.3.294
    paths:
      - ".github/workflows/tmp-dispatch-panel-v2394.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Release Panel on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-panel.yml --ref main --repo "$GITHUB_REPOSITORY"
