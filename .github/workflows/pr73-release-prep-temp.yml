name: PR73 Release Prep Temporary

on:
  push:
    branches:
      - fix/advanced-probe-carrier-history
    paths:
      - ".github/workflows/pr73-release-prep-temp.yml"

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/advanced-probe-carrier-history
          fetch-depth: 0

      - name: Prepare v2.3.293 release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const replaceExactOnce = (path, from, to) => {
            const text = fs.readFileSync(path, 'utf8');
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`${path}: expected exactly one occurrence of ${JSON.stringify(from)}, got ${count}`);
            fs.writeFileSync(path, text.replace(from, to));
          };

          replaceExactOnce('package.json', '"version": "2.3.292"', '"version": "2.3.293"');
          replaceExactOnce('shared/versions.ts', 'export const APP_VERSION = "2.3.292";', 'export const APP_VERSION = "2.3.293";');
          replaceExactOnce('shared/versions.ts', 'export const ANDROID_APK_RELEASE_VERSION = "2.3.292";', 'export const ANDROID_APK_RELEASE_VERSION = "2.3.293";');
          replaceExactOnce('shared/versions.ts', 'export const AGENT_VERSION = "2.2.198";', 'export const AGENT_VERSION = "2.2.199";');
          replaceExactOnce('agent/main.go', 'var Version = "2.2.198"', 'var Version = "2.2.199"');

          const changelogPath = 'CHANGELOG.md';
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          const marker = '# Changelog\n\n';
          if (!changelog.startsWith(marker)) throw new Error('CHANGELOG.md: unexpected header');
          if (changelog.includes('## [2.3.293]')) throw new Error('CHANGELOG.md: 2.3.293 already exists');
          const section = `## [2.3.293] - 2026-09-02\n\n### 新增\n\n- 主机管理「高级探测」新增三网目标探测历史视图，按主机与服务分别展示 RTT 与探测失败率，并对 Ping 丢包与 TCPing 连接失败使用不同语义。\n- 上海三网默认验证方案采用电信 Ping \`202.96.209.5\`、联通 TCPing \`210.22.84.3:53\`、移动 Ping \`211.136.150.66\`，避免把单一 ICMP 目标无响应误解释为运营商整体故障。\n\n### 修复与优化\n\n- 修复五次质量 Ping 采用突发 ICMP 发送、可能在限速目标上制造假性部分丢包的问题；多样本探测改为传统 paced Ping，单样本仍保留原生低开销路径。\n- 修复高级探测服务修改后，运行中的 Agent 可能继续沿用旧的 Ping/TCPing 任务直到审计周期或进程重启的问题；服务变更现在会立即刷新受影响 Agent。\n- 修复探测方式、目标 IP/域名或 TCPing 端口变化后，旧历史被当前配置重新解释的问题；测量身份变化时只清理该服务自己的不兼容历史，名称、间隔、主机范围与启停变化继续保留历史。\n- 三网图表默认使用 P95 聚焦 RTT 量程，单独显示 0–100% 失败率，并明确固定目标失败不等于整个运营商网络失败。\n\n### 版本\n\n- 面板与 APK Release \`2.3.293\`，Agent \`2.2.199\`，ForwardX FXP runtime \`2.2.114\`，Android APP \`2.3.97\`。\n\n`;
          fs.writeFileSync(changelogPath, marker + section + changelog.slice(marker.length));
          NODE

          rm -f .github/workflows/pr73-release-prep-temp.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json shared/versions.ts agent/main.go CHANGELOG.md .github/workflows/pr73-release-prep-temp.yml
          git diff --cached --stat
          git commit -m "chore(release): prepare v2.3.293"
          git push origin HEAD:fix/advanced-probe-carrier-history
