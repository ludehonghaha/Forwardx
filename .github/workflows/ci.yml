name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: forwardx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/release-2.3.279
          fetch-depth: 0

      - name: Apply release metadata and clean temporary patch
        if: ${{ !contains(github.event.pull_request.head.sha || github.sha, 'never') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .ci-release-279.py ]; then
            python3 .ci-release-279.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git checkout origin/main -- .github/workflows/ci.yml
            git rm .ci-release-279.py
            git add package.json shared/versions.ts CHANGELOG.md .github/workflows/ci.yml
            git commit -m "chore(release): v2.3.279"
            git push origin HEAD:codex/release-2.3.279
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            agent/go.mod
            forwardx-fxp/go.mod
            forwardx-fxp/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify panel
        run: |
          pnpm check:versions
          pnpm exec tsc --noEmit
          node --import tsx --test server/agentCrypto.test.ts
          pnpm test:protocol-access
          pnpm test:server
          pnpm build
          pnpm docs:build

      - name: Verify Agent and FXP
        run: |
          (cd agent && go test ./... && go vet ./...)
          (cd forwardx-fxp && go test ./... && go vet ./...)
