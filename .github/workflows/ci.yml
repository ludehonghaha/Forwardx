name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: forwardx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/fix-mihomo-agent-runtime-state
          fetch-depth: 0

      - name: Apply staged Mihomo Agent patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/codex_patch_mihomo_agent.py
          gofmt -w agent/main.go agent/mihomo_runtime_test.go
          (cd agent && go test ./...)
          git diff --check
          rm -f scripts/codex_patch_mihomo_agent.py .github/workflows/codex-mihomo-agent-state.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent): report and self-heal managed Mihomo runtime"
          git push origin HEAD:codex/fix-mihomo-agent-runtime-state

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            agent/go.mod
            forwardx-fxp/go.mod
            forwardx-fxp/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify panel
        run: |
          pnpm check:versions
          pnpm exec tsc --noEmit
          node --import tsx --test server/agentCrypto.test.ts
          pnpm test:protocol-access
          pnpm test:server
          pnpm build
          pnpm docs:build

      - name: Verify Agent and FXP
        run: |
          (cd agent && go test ./... && go vet ./...)
          (cd forwardx-fxp && go test ./... && go vet ./...)
