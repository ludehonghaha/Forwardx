name: P0-2C Bump Agent 2.2.196 Once

on:
  push:
    branches:
      - fix/p0-2c-reality-multi-user
    paths:
      - .github/workflows/p0-2c-bump-agent-2-2-196-once.yml

permissions:
  contents: write

jobs:
  bump-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/p0-2c-reality-multi-user
          fetch-depth: 0

      - name: Bump Agent version gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (Path('agent/main.go'), 'var Version = "2.2.195"', 'var Version = "2.2.196"'),
              (Path('shared/versions.ts'), 'export const AGENT_VERSION = "2.2.195";', 'export const AGENT_VERSION = "2.2.196";'),
          ]
          for path, old, new in replacements:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w agent/main.go
          git diff --check
          git diff -- agent/main.go shared/versions.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: agent/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version gate and Panel
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:versions
          pnpm exec tsc --noEmit
          node --import tsx --test server/protocolXrayMigration.test.ts server/protocolManagedRuntimePlans.test.ts server/protocolXrayRuntimeAction.test.ts server/protocolRuntimeStatus.test.ts
          pnpm test:protocol-access
          pnpm build

      - name: Verify Agent
        shell: bash
        run: |
          set -euo pipefail
          cd agent
          go test ./...
          go vet ./...

      - name: Commit version bump and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p0-2c-bump-agent-2-2-196-once.yml
          git add agent/main.go shared/versions.ts
          git commit -m 'chore(agent): bump Xray runtime gate to 2.2.196'
          git push origin HEAD:fix/p0-2c-reality-multi-user
