name: Bootstrap Current Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-current-release.yml"

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Create current Release when missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="v$(node -p "require('./package.json').version")"
          if ! gh release view "$release_version" >/dev/null 2>&1; then
            gh release create "$release_version" \
              --target "$GITHUB_SHA" \
              --title "$release_version" \
              --notes "ForwardX $release_version"
          fi
