name: P0-2C Reality Assignment Refresh Fix Once

on:
  push:
    branches:
      - fix/p0-2c-reality-multi-user

permissions:
  contents: write

concurrency:
  group: p0-2c-reality-assignment-refresh-fix-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-2c-reality-multi-user
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Apply minimal Reality assignment refresh fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          route = Path('server/routers/protocolAccess.ts')
          s = route.read_text()

          def replace_once(old: str, new: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          replace_once(
          '''  protocolTrafficBridgeMarker,\n  pushProtocolTrafficBridgeRefresh,''',
          '''  protocolTrafficBridgeMarker,\n  managedProtocolUsesNativeUserAccounting,\n  pushProtocolTrafficBridgeRefresh,''')

          replace_once(
          '''async function recordManagedMieruAssignmentRevision(\n  endpoint: any,\n  mutation: {\n    operation: "set" | "remove";\n    assignmentId?: number;\n    userId: number;\n    isEnabled?: boolean;\n  },\n) {\n  const endpointId = Number(endpoint?.id || 0);\n  const hostId = Number(endpoint?.hostId || 0);\n  if (\n    endpoint?.runtimeMode !== "managed"\n    || endpoint?.protocol !== "mieru"\n    || !Number.isInteger(endpointId)\n    || endpointId <= 0\n    || !Number.isInteger(hostId)\n    || hostId <= 0\n  ) return 0;\n  return recordConfigAuditEvent({\n    resourceType: "protocol_endpoint",\n    resourceId: endpointId,\n    hostId,\n    action: "update",\n    before: { protocol: "mieru", managedMieruAssignmentMutation: null },\n    after: {\n      protocol: "mieru",\n      managedMieruAssignmentMutation: {\n        ...mutation,\n        nonce: randomUUID(),\n      },\n    },\n    source: "protocol_assignment",\n  });\n}\n''',
          '''async function recordManagedNativeAssignmentRevision(\n  endpoint: any,\n  mutation: {\n    operation: "set" | "remove";\n    assignmentId?: number;\n    userId: number;\n    isEnabled?: boolean;\n  },\n) {\n  const endpointId = Number(endpoint?.id || 0);\n  const hostId = Number(endpoint?.hostId || 0);\n  const protocol = String(endpoint?.protocol || "");\n  if (\n    endpoint?.runtimeMode !== "managed"\n    || (protocol !== "mieru" && protocol !== "vless_reality")\n    || !Number.isInteger(endpointId)\n    || endpointId <= 0\n    || !Number.isInteger(hostId)\n    || hostId <= 0\n  ) return 0;\n  return recordConfigAuditEvent({\n    resourceType: "protocol_endpoint",\n    resourceId: endpointId,\n    hostId,\n    action: "update",\n    before: { protocol, managedNativeAssignmentMutation: null },\n    after: {\n      protocol,\n      managedNativeAssignmentMutation: {\n        ...mutation,\n        nonce: randomUUID(),\n      },\n    },\n    source: "protocol_assignment",\n  });\n}\n''')

          replace_once(
          '''    if (endpoint.runtimeMode === "managed" && endpoint.protocol === "mieru") {\n      await recordManagedMieruAssignmentRevision(endpoint, {\n        operation: "set",\n        assignmentId: id,\n        userId: input.userId,\n        isEnabled: input.isEnabled,\n      });\n      if (refreshHostId <= 0) refreshHostId = Number(endpoint.hostId || 0);\n    }\n    if (refreshHostId > 0) {\n      pushProtocolTrafficBridgeRefresh(\n        refreshHostId,\n        endpoint.runtimeMode === "managed" && endpoint.protocol === "mieru"\n          ? "managed-mieru-assignment-updated"\n          : "protocol-traffic-bridge-assignment-updated",\n      );\n    }''',
          '''    if (managedProtocolUsesNativeUserAccounting(endpoint)) {\n      await recordManagedNativeAssignmentRevision(endpoint, {\n        operation: "set",\n        assignmentId: id,\n        userId: input.userId,\n        isEnabled: input.isEnabled,\n      });\n      if (refreshHostId <= 0) refreshHostId = Number(endpoint.hostId || 0);\n    }\n    if (refreshHostId > 0) {\n      pushProtocolTrafficBridgeRefresh(\n        refreshHostId,\n        endpoint.runtimeMode === "managed" && endpoint.protocol === "mieru"\n          ? "managed-mieru-assignment-updated"\n          : endpoint.runtimeMode === "managed" && endpoint.protocol === "vless_reality"\n            ? "managed-reality-assignment-updated"\n            : "protocol-traffic-bridge-assignment-updated",\n      );\n    }''')

          replace_once(
          '''    if (endpoint?.runtimeMode === "managed" && endpoint?.protocol === "mieru") {\n      await recordManagedMieruAssignmentRevision(endpoint, {\n        operation: "remove",\n        userId: input.userId,\n      });\n      if (refreshHostId <= 0) refreshHostId = Number(endpoint.hostId || 0);\n    }\n    if (refreshHostId > 0) {\n      pushProtocolTrafficBridgeRefresh(\n        refreshHostId,\n        endpoint?.runtimeMode === "managed" && endpoint?.protocol === "mieru"\n          ? "managed-mieru-assignment-removed"\n          : "protocol-traffic-bridge-assignment-removed",\n      );\n    }''',
          '''    if (managedProtocolUsesNativeUserAccounting(endpoint)) {\n      await recordManagedNativeAssignmentRevision(endpoint, {\n        operation: "remove",\n        userId: input.userId,\n      });\n      if (refreshHostId <= 0) refreshHostId = Number(endpoint?.hostId || 0);\n    }\n    if (refreshHostId > 0) {\n      pushProtocolTrafficBridgeRefresh(\n        refreshHostId,\n        endpoint?.runtimeMode === "managed" && endpoint?.protocol === "mieru"\n          ? "managed-mieru-assignment-removed"\n          : endpoint?.runtimeMode === "managed" && endpoint?.protocol === "vless_reality"\n            ? "managed-reality-assignment-removed"\n            : "protocol-traffic-bridge-assignment-removed",\n      );\n    }''')

          route.write_text(s)

          test_file = Path('server/protocolTrafficBridge.test.ts')
          t = test_file.read_text()
          if 'import { readFileSync } from "node:fs";' not in t:
              t = t.replace(
                  'import assert from "node:assert/strict";\n',
                  'import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n',
                  1,
              )
          marker = 'test("managed native-user assignment mutations force revision and Agent refresh", () => {'
          if marker not in t:
              t += '''\n\ntest("managed native-user assignment mutations force revision and Agent refresh", () => {\n  const source = readFileSync(new URL("./routers/protocolAccess.ts", import.meta.url), "utf8");\n  assert.match(source, /managedProtocolUsesNativeUserAccounting\\(endpoint\\)/);\n  assert.match(source, /recordManagedNativeAssignmentRevision\\(endpoint/);\n  assert.match(source, /managed-reality-assignment-updated/);\n  assert.match(source, /managed-reality-assignment-removed/);\n});\n'''
          test_file.write_text(t)
          PY

          git diff --check
          git diff -- server/routers/protocolAccess.ts server/protocolTrafficBridge.test.ts

      - name: Verify focused Panel coverage
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test:protocol-access

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p0-2c-reality-assignment-refresh-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/routers/protocolAccess.ts server/protocolTrafficBridge.test.ts .github/workflows/p0-2c-reality-assignment-refresh-fix-once.yml
          git diff --cached --check
          git commit -m "fix(p0-2c): refresh Reality runtime after assignment changes"
          git push origin HEAD:fix/p0-2c-reality-multi-user
