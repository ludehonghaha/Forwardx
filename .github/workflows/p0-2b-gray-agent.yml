name: P0-2B Gray Agent

on:
  push:
    branches:
      - fix/p0-2b-mieru-multi-user
    paths:
      - "agent/**"
      - "shared/versions.ts"
      - ".github/workflows/p0-2b-gray-agent.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-2b-gray-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: agent/go.mod

      - name: Test Agent
        shell: bash
        run: |
          set -euo pipefail
          cd agent
          go test ./...
          go vet ./...

      - name: Build isolated gray Agent binaries
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE "s/.*AGENT_VERSION[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" shared/versions.ts | head -n1)"
          VERSION="${VERSION#v}"
          test -n "$VERSION"
          mkdir -p dist/p0-2b-gray-agent

          (
            cd agent
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" \
              -o ../dist/p0-2b-gray-agent/forwardx-agent-p0-2b-gray-linux-amd64 .
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" \
              -o ../dist/p0-2b-gray-agent/forwardx-agent-p0-2b-gray-linux-arm64 .
          )

          sha256sum dist/p0-2b-gray-agent/forwardx-agent-p0-2b-gray-linux-* \
            > dist/p0-2b-gray-agent/SHA256SUMS

          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "AGENT_VERSION=$VERSION"
          cat dist/p0-2b-gray-agent/SHA256SUMS

      - name: Verify amd64 binary starts and P0-2B reporter source is present
        shell: bash
        run: |
          set -euo pipefail
          test -f agent/mieru_traffic_reporter.go
          grep -q "MITA_UDS_PATH=/run/forwardx-mita/mita.sock" agent/mieru_traffic_reporter.go
          chmod +x dist/p0-2b-gray-agent/forwardx-agent-p0-2b-gray-linux-amd64
          dist/p0-2b-gray-agent/forwardx-agent-p0-2b-gray-linux-amd64 -h >/tmp/agent-help.txt 2>&1 || true
          grep -q -- "-config" /tmp/agent-help.txt

      - name: Publish isolated prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="p0-2b-agent-gray-${GITHUB_SHA:0:8}"
          TITLE="P0-2B Gray Agent ${GITHUB_SHA:0:8}"
          NOTES="Isolated P0-2B gray Agent build for PR #39. Source commit: ${GITHUB_SHA}. Not a production release."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/p0-2b-gray-agent/forwardx-agent-p0-2b-gray-linux-amd64 \
              dist/p0-2b-gray-agent/forwardx-agent-p0-2b-gray-linux-arm64 \
              dist/p0-2b-gray-agent/SHA256SUMS \
              --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              dist/p0-2b-gray-agent/forwardx-agent-p0-2b-gray-linux-amd64 \
              dist/p0-2b-gray-agent/forwardx-agent-p0-2b-gray-linux-arm64 \
              dist/p0-2b-gray-agent/SHA256SUMS
          fi

          echo "Published isolated gray Agent release: $TAG"
