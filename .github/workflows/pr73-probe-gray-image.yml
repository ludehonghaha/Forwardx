name: PR73 Probe Gray Image

on:
  push:
    branches:
      - ci/pr73-probe-gray-image
    paths:
      - ".github/workflows/pr73-probe-gray-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/forwardx
  SOURCE_SHA: 255e332f9184ca90ec4fa9529165469dbd58e322
  GRAY_TAG: pr73-probe-gray-safe-255e332f

concurrency:
  group: pr73-probe-gray-image
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            node_arch: x64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            node_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout verified gray source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Read package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=ForwardX
            org.opencontainers.image.description=ForwardX PR73 corrected carrier probe passive gray image
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.forwardx.gray=pr73-probe-passive
          build-args: |
            FORWARDX_VERSION=${{ steps.package.outputs.version }}
          cache-from: type=gha,scope=forwardx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=forwardx-${{ matrix.arch }}
      - name: Verify native runtime
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}@${DIGEST}"
          docker run --rm --platform "${PLATFORM}" --entrypoint node \
            -e "EXPECTED_NODE_ARCH=${EXPECTED_NODE_ARCH}" -e "EXPECTED_VERSION=${VERSION}" \
            "${IMAGE_NAME}@${DIGEST}" -e '
              const Database = require("better-sqlite3");
              const db = new Database(":memory:");
              const value = db.prepare("select 1 as value").pluck().get();
              db.close();
              if (value !== 1) throw new Error("SQLite runtime check failed");
              if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error(`Expected ${process.env.EXPECTED_NODE_ARCH}, got ${process.arch}`);
              if (process.env.FORWARDX_IMAGE_VERSION !== process.env.EXPECTED_VERSION) throw new Error(`Expected version ${process.env.EXPECTED_VERSION}, got ${process.env.FORWARDX_IMAGE_VERSION}`);
            '
      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: pr73-probe-gray-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: pr73-probe-gray-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish gray manifest only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)
          test "${#digest_files[@]}" -eq 2
          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done
          gray_ref="${IMAGE_NAME}:${GRAY_TAG}"
          docker buildx imagetools create -t "${gray_ref}" "${sources[@]}"
          manifest_json="$(docker buildx imagetools inspect "${gray_ref}" --raw)"
          echo "${manifest_json}" | jq -e '([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1'
          digest="$(docker buildx imagetools inspect "${gray_ref}" | awk '$1 == "Digest:" { digest=$2 } END { print digest }')"
          test -n "${digest}"
          echo "GRAY_IMAGE=${gray_ref}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
