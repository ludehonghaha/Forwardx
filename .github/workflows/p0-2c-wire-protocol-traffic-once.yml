name: P0-2C Wire Protocol Traffic Once

on:
  push:
    branches:
      - fix/p0-2c-reality-multi-user
    paths:
      - .github/workflows/p0-2c-wire-protocol-traffic-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/p0-2c-reality-multi-user
          fetch-depth: 0

      - name: Patch protocol traffic route
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server/agentReportRoutes.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { getAgentHostIdentityFromRequest } from "./agentAuth";',
              'import { getAgentHostIdentityFromRequest, getResolvedAgentToken } from "./agentAuth";',
              'agent auth import',
          )
          replace_once(
              'import { selectAgentTrafficReportInterval } from "./agentHeartbeatGate";\n',
              'import { selectAgentTrafficReportInterval } from "./agentHeartbeatGate";\n'
              'import {\n'
              '  accountAgentProtocolTrafficReport,\n'
              '  AgentProtocolTrafficValidationError,\n'
              '} from "./agentProtocolTrafficAccounting";\n',
              'protocol accounting import',
          )

          old_gate = '''    if (!Array.isArray(req.body?.stats) && !Array.isArray(req.body?.s) && !hostTraffic) {
              res.status(400).json({ error: "stats array or hostTraffic is required" });
              return;
            }
            // An idle Agent may only report the host-wide network counters. Avoid
          '''
          new_gate = '''    const hasProtocolTrafficPayload =
              req.body?.protocolStats !== undefined || req.body?.mieruStats !== undefined;
            if (!Array.isArray(req.body?.stats) && !Array.isArray(req.body?.s) && !hostTraffic && !hasProtocolTrafficPayload) {
              res.status(400).json({ error: "stats array, hostTraffic, or protocol traffic is required" });
              return;
            }

            let protocolTrafficResult: Awaited<ReturnType<typeof accountAgentProtocolTrafficReport>> | null = null;
            if (hasProtocolTrafficPayload) {
              protocolTrafficResult = await accountAgentProtocolTrafficReport({
                token: String(getResolvedAgentToken(req) || ""),
                body: req.body,
              });
            }

            // A protocol-only report must not fall through to the generic idle
            // traffic claim. The protocol accounting transaction above is the ACK
            // boundary for assignment traffic and owns its own producer namespace.
            if (stats.length === 0 && !hostTraffic && hasProtocolTrafficPayload) {
              res.json({
                success: true,
                ...(protocolTrafficResult?.duplicate ? { duplicate: true } : {}),
              });
              return;
            }

            // An idle Agent may only report the host-wide network counters. Avoid
          '''
          replace_once(old_gate, new_gate, 'traffic protocol gate')

          old_catch = '''  } catch (error) {
              console.error(`[Agent Traffic] Error host=${logHostId || "-"} name=${logHostName || "-"}:`, error);
              res.status(500).json({ error: "Internal server error" });
            }
          });
          '''
          new_catch = '''  } catch (error) {
              if (error instanceof AgentProtocolTrafficValidationError) {
                res.status(error.statusCode).json({ error: error.message });
                return;
              }
              console.error(`[Agent Traffic] Error host=${logHostId || "-"} name=${logHostName || "-"}:`, error);
              res.status(500).json({ error: "Internal server error" });
            }
          });
          '''
          replace_once(old_catch, new_catch, 'traffic validation catch')

          path.write_text(text)
          PY

      - name: Add protocol traffic route integration test
        shell: bash
        run: |
          cat > server/agentProtocolTrafficRoute.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import test from "node:test";

          test("protocol-only Agent traffic route accounts two Reality assignments exactly once", () => {
            const directory = fs.mkdtempSync(path.join(os.tmpdir(), "forwardx-protocol-traffic-route-"));
            const databasePath = path.join(directory, "protocol-traffic.db");
            const script = String.raw`
              import assert from "node:assert/strict";
              import http from "node:http";
              import path from "node:path";
              import { pathToFileURL } from "node:url";
              import express from "express";

              const url = (file) => pathToFileURL(path.join(process.cwd(), file)).href;
              const runtime = await import(url("server/dbRuntime.ts"));
              const schema = await import(url("server/dbSchema.ts"));
              const reports = await import(url("server/agentReportRoutes.ts"));

              let server;
              try {
                await runtime.connectDatabase({ type: "sqlite", sqlite: { path: process.env.FORWARDX_TEST_DB } });
                await schema.ensureDatabaseSchema();

                await runtime.executeRaw(
                  'INSERT INTO "users" ("id", "username", "password", "name", "role", "trafficUsed") VALUES (?, ?, ?, ?, ?, ?), (?, ?, ?, ?, ?, ?), (?, ?, ?, ?, ?, ?)',
                  [
                    1, "protocol-admin", "hash", "Protocol Admin", "admin", 0,
                    2, "reality-user-a", "hash", "Reality User A", "user", 0,
                    3, "reality-user-b", "hash", "Reality User B", "user", 0,
                  ],
                );
                await runtime.executeRaw(
                  'INSERT INTO "hosts" ("id", "name", "ip", "hostType", "agentToken", "userId") VALUES (?, ?, ?, ?, ?, ?)',
                  [7, "xray-host", "127.0.0.7", "slave", "xray-route-token", 1],
                );
                await runtime.executeRaw(
                  'INSERT INTO "protocol_endpoints" ("id", "name", "protocol", "runtimeMode", "hostId", "publicHost", "publicPort", "configJson", "isEnabled") VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)',
                  [22, "Shared Reality", "vless_reality", "managed", 7, "edge.example.test", 27075, "{}", 1],
                );
                await runtime.executeRaw(
                  'INSERT INTO "protocol_user_access" ("id", "endpointId", "userId", "credentialJson", "isEnabled") VALUES (?, ?, ?, ?, ?), (?, ?, ?, ?, ?)',
                  [501, 22, 2, '{"uuid":"11111111-1111-4111-8111-111111111111"}', 1, 502, 22, 3, '{"uuid":"22222222-2222-4222-8222-222222222222"}', 1],
                );

                const app = express();
                app.use(express.json());
                app.use((req, _res, next) => {
                  const authorization = String(req.headers.authorization || "");
                  req.agentToken = authorization.startsWith("Bearer ") ? authorization.slice(7) : "";
                  next();
                });
                reports.registerAgentReportRoutes(app);
                server = http.createServer(app);
                await new Promise((resolve, reject) => {
                  server.once("error", reject);
                  server.listen(0, "127.0.0.1", resolve);
                });
                const address = server.address();
                assert.ok(address && typeof address === "object");
                const endpoint = "http://127.0.0.1:" + address.port + "/api/agent/traffic";
                const payload = {
                  stats: [],
                  protocolStats: [
                    { assignmentId: 501, bytesIn: 100, bytesOut: 900 },
                    { assignmentId: 502, bytesIn: 200, bytesOut: 1800 },
                  ],
                  reportId: "xray-two-users-1",
                  reportProducerId: "xray-agent-boot-1",
                };

                const post = async () => {
                  const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                      authorization: "Bearer xray-route-token",
                      "content-type": "application/json",
                    },
                    body: JSON.stringify(payload),
                  });
                  return { status: response.status, body: await response.json() };
                };

                const first = await post();
                assert.equal(first.status, 200);
                assert.equal(first.body.success, true);
                assert.notEqual(first.body.duplicate, true);

                const bucketsAfterFirst = await runtime.queryRaw(
                  'SELECT assignment_id AS assignmentId, endpoint_id AS endpointId, user_id AS userId, host_id AS hostId, bytes_in AS bytesIn, bytes_out AS bytesOut FROM protocol_user_traffic_buckets ORDER BY assignment_id',
                );
                assert.deepEqual(bucketsAfterFirst, [
                  { assignmentId: 501, endpointId: 22, userId: 2, hostId: 7, bytesIn: 100, bytesOut: 900 },
                  { assignmentId: 502, endpointId: 22, userId: 3, hostId: 7, bytesIn: 200, bytesOut: 1800 },
                ]);
                assert.deepEqual(
                  await runtime.queryRaw('SELECT id, "trafficUsed" AS trafficUsed FROM users WHERE id IN (?, ?) ORDER BY id', [2, 3]),
                  [
                    { id: 2, trafficUsed: 1000 },
                    { id: 3, trafficUsed: 2000 },
                  ],
                );

                const duplicate = await post();
                assert.deepEqual(duplicate, { status: 200, body: { success: true, duplicate: true } });
                assert.deepEqual(
                  await runtime.queryRaw('SELECT id, "trafficUsed" AS trafficUsed FROM users WHERE id IN (?, ?) ORDER BY id', [2, 3]),
                  [
                    { id: 2, trafficUsed: 1000 },
                    { id: 3, trafficUsed: 2000 },
                  ],
                );
                assert.equal(
                  Number((await runtime.queryRaw('SELECT COUNT(*) AS count FROM agent_traffic_reports WHERE "hostId" = ? AND "reportId" = ?', [7, "xray-two-users-1"]))[0].count),
                  1,
                );
              } finally {
                if (server) await new Promise((resolve) => server.close(resolve));
                await runtime.disconnectDatabase?.();
              }
            `;

            const result = spawnSync(process.execPath, ["--import", "tsx", "--input-type=module", "--eval", script], {
              cwd: process.cwd(),
              env: {
                ...process.env,
                DATABASE_TYPE: "sqlite",
                SQLITE_PATH: databasePath,
                FORWARDX_TEST_DB: databasePath,
              },
              encoding: "utf8",
              timeout: 60_000,
            });
            assert.equal(result.status, 0, `child failed\nstdout:\n${result.stdout}\nstderr:\n${result.stderr}`);
          });
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Panel protocol accounting
        run: |
          pnpm exec tsc --noEmit
          node --import tsx --test \
            server/agentProtocolTrafficAccounting.test.ts \
            server/agentProtocolTrafficRoute.test.ts \
            server/protocolXrayPlan.test.ts \
            server/protocolXrayMigration.test.ts \
            server/protocolXrayRuntimeAction.test.ts
          pnpm build

      - name: Verify Agent reporter
        working-directory: agent
        run: |
          go test ./...
          go vet ./...

      - name: Commit verified wiring and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/p0-2c-wire-protocol-traffic-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/agentReportRoutes.ts server/agentProtocolTrafficRoute.test.ts .github/workflows/p0-2c-wire-protocol-traffic-once.yml
          git commit -m "fix(p0-2c): account protocol traffic before ACK"
          git push origin HEAD:fix/p0-2c-reality-multi-user
