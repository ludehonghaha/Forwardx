name: Temp Protocol Address Reality UI Patch

on:
  push:
    branches:
      - codex/protocol-host-auto-address

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[protocol-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/protocol-host-auto-address
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/ProtocolAccess.tsx')
          s = p.read_text()

          old = '''function userLabel(user: any) {
            const name = String(user?.name || "").trim();
            const username = String(user?.username || "").trim();
            return name && name !== username ? `${name}（${username}）` : username || `用户 #${user?.id}`;
          }
'''
          new = old + '''\nfunction preferredProtocolPublicHost(host: any) {
            const ddnsDomain = String(host?.ddnsDomain || "").trim();
            if (host?.ddnsEnabled && ddnsDomain) return ddnsDomain;
            for (const candidate of [host?.entryIp, host?.ipv4, host?.ip, host?.ipv6]) {
              const value = String(candidate || "").trim();
              if (value) return value;
            }
            return "";
          }
'''
          if s.count(old) != 1:
            raise SystemExit('userLabel insertion point mismatch')
          s = s.replace(old, new, 1)

          old = '''  const openCreateEndpoint = () => {
            setEndpointForm({ ...emptyEndpointForm });
            setEndpointEditorOpen(true);
          };
'''
          new = '''  const openCreateEndpoint = () => {
            const defaultHost = hosts.length === 1 ? hosts[0] : null;
            setEndpointForm({
              ...emptyEndpointForm,
              ...(defaultHost ? {
                hostId: String(defaultHost.id),
                publicHost: preferredProtocolPublicHost(defaultHost),
              } : {}),
            });
            setEndpointEditorOpen(true);
          };
'''
          if s.count(old) != 1:
            raise SystemExit('openCreateEndpoint block mismatch')
          s = s.replace(old, new, 1)

          old = '''                        sourceConfig: {},
                        udp: ["mieru", "snell", "vless_reality"].includes(protocol),
'''
          new = '''                        sourceConfig: protocol === "vless_reality" ? {
                          serverName: "www.cloudflare.com",
                          realityDest: "www.cloudflare.com:443",
                          clientFingerprint: "chrome",
                        } : {},
                        udp: ["mieru", "snell", "vless_reality"].includes(protocol),
'''
          if s.count(old) != 1:
            raise SystemExit('protocol sourceConfig block mismatch')
          s = s.replace(old, new, 1)

          old = '''                <Input value={endpointForm.publicHost} onChange={(event) => setEndpointForm({ ...endpointForm, publicHost: event.target.value })} placeholder="211.136.162.184" />
'''
          new = '''                <Input value={endpointForm.publicHost} onChange={(event) => setEndpointForm({ ...endpointForm, publicHost: event.target.value })} placeholder={endpointForm.runtimeMode === "managed" ? "选择 Agent 主机后自动带入" : "公网域名或 IP"} />
                {endpointForm.runtimeMode === "managed" && <p className="text-xs text-muted-foreground">默认跟随所选 Agent 主机；需要特殊入口域名或 NAT 地址时可手动覆盖。</p>}
'''
          if s.count(old) != 1:
            raise SystemExit('public host input block mismatch')
          s = s.replace(old, new, 1)

          old = '''                    <Select value={endpointForm.hostId} onValueChange={(hostId) => setEndpointForm({ ...endpointForm, hostId })}>
'''
          new = '''                    <Select
                      value={endpointForm.hostId}
                      onValueChange={(hostId) => {
                        const selectedHost = hosts.find((host) => String(host.id) === hostId);
                        const publicHost = preferredProtocolPublicHost(selectedHost);
                        setEndpointForm({
                          ...endpointForm,
                          hostId,
                          ...(!endpointForm.id && publicHost ? { publicHost } : {}),
                        });
                      }}
                    >
'''
          if s.count(old) != 1:
            raise SystemExit('host select block mismatch')
          s = s.replace(old, new, 1)

          old = '''              ) : endpointForm.protocol === "vless_reality" ? (
                <div className="rounded-lg border p-3 text-xs leading-5 text-muted-foreground sm:col-span-2">
                  托管 Reality 会自动生成 UUID、X25519 密钥和 Short ID；默认伪装目标为 www.cloudflare.com:443。保存后订阅自动包含客户端公钥参数。
                </div>
              ) : (
'''
          new = '''              ) : endpointForm.protocol === "vless_reality" ? (
                <>
                  <div className="rounded-lg border p-3 text-xs leading-5 text-muted-foreground sm:col-span-2">
                    托管 Reality 会自动生成 UUID、X25519 密钥和 Short ID；SNI 与 Dest 可自行选择。留空时仍回退到 www.cloudflare.com / www.cloudflare.com:443，保存后订阅自动包含客户端公钥参数。
                  </div>
                  <div className="space-y-2">
                    <Label>Reality Server Name（SNI）</Label>
                    <Input
                      value={String(endpointForm.sourceConfig.serverName ?? "www.cloudflare.com")}
                      onChange={(event) => setEndpointForm({
                        ...endpointForm,
                        sourceConfig: { ...endpointForm.sourceConfig, serverName: event.target.value },
                      })}
                      placeholder="www.cloudflare.com"
                    />
                  </div>
                  <div className="space-y-2">
                    <Label>Reality Dest</Label>
                    <Input
                      value={String(endpointForm.sourceConfig.realityDest ?? "www.cloudflare.com:443")}
                      onChange={(event) => setEndpointForm({
                        ...endpointForm,
                        sourceConfig: { ...endpointForm.sourceConfig, realityDest: event.target.value },
                      })}
                      placeholder="www.cloudflare.com:443"
                    />
                    <p className="text-xs text-muted-foreground">格式为域名或 IP + 端口，例如 www.microsoft.com:443。</p>
                  </div>
                </>
              ) : (
'''
          if s.count(old) != 1:
            raise SystemExit('Reality UI block mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-protocol-address-reality-ui.yml
          git add client/src/pages/ProtocolAccess.tsx
          git commit -m "feat(protocol): auto fill host and expose Reality target [protocol-ui-applied]"
          git push origin HEAD:codex/protocol-host-auto-address
