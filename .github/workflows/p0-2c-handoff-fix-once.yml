name: P0-2C handoff fix once

on:
  push:
    branches:
      - fix/p0-2c-reality-multi-user

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-2c-reality-multi-user
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Patch heartbeat handoff ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/agentHeartbeatRoute.ts')
          text = path.read_text()

          replacements = [
              (
                  'anchor1',
                  '    const mihomoRuntimeRelevant = mihomoDesiredRelevant || mihomoRuntimeConfigChanged;',
                  '    const mihomoRuntimeRelevant = mihomoDesiredRelevant || mihomoRuntimeConfigChanged;\n    let mihomoRuntimeSyncQueued = false;',
              ),
              (
                  'anchor2',
                  '      )) actions.push(mihomoRuntimeSyncAction);',
                  '      )) {\n        actions.push(mihomoRuntimeSyncAction);\n        mihomoRuntimeSyncQueued = true;\n      }',
              ),
              (
                  'anchor3',
                  '      && !deferXrayForMihomoHandoff\n',
                  '      && !deferXrayForMihomoHandoff\n      && !mihomoRuntimeSyncQueued\n',
              ),
          ]

          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Verify targeted Panel paths
        run: |
          pnpm install --frozen-lockfile
          node --import tsx --test \
            server/protocolXrayMigration.test.ts \
            server/protocolXrayRuntimeAction.test.ts \
            server/protocolManagedRuntimePlans.test.ts \
            server/protocolRuntimeStatus.test.ts
          pnpm build
      - name: Commit patch and self-delete
        run: |
          rm -f .github/workflows/p0-2c-handoff-fix-once.yml
          rm -f .github/p0-2c-handoff-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/agentHeartbeatRoute.ts .github/workflows/p0-2c-handoff-fix-once.yml .github/p0-2c-handoff-trigger
          git diff --cached --check
          git commit -m "fix(p0-2c): serialize Mihomo to Xray handoff"
          git push origin HEAD:fix/p0-2c-reality-multi-user
