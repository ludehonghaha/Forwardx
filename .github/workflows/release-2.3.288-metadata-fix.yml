name: Release 2.3.288 metadata fix

on:
  push:
    branches:
      - release/2.3.288

permissions:
  contents: write

jobs:
  fix-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/2.3.288
          fetch-depth: 0

      - name: Apply exact release metadata
        shell: bash
        env:
          RELEASE_SECTION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          main = Path("agent/main.go")
          source = main.read_text()
          old = 'var Version = "2.2.196"'
          new = 'var Version = "2.2.197"'
          if new not in source:
              if old not in source:
                  raise SystemExit("agent/main.go version marker not found")
              main.write_text(source.replace(old, new, 1))
          changelog = Path("CHANGELOG.md")
          text = changelog.read_text().replace("客戵端", "客户端")
          heading = "## [2.3.288] - 2026-08-30"
          if heading not in text:
              prefix = "# Changelog\n\n"
              if not text.startswith(prefix):
                  raise SystemExit("CHANGELOG header not found")
              section = base64.b64decode(os.environ["RELEASE_SECTION_B64"]).decode()
              text = prefix + section + text[len(prefix):]
          changelog.write_text(text)
          PY

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- agent/main.go CHANGELOG.md; then
            echo "Release metadata already correct"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/main.go CHANGELOG.md
          git commit -m "release: finalize v2.3.288 metadata"
          git push origin HEAD:release/2.3.288
