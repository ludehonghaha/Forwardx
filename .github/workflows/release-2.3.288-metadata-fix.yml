name: Release 2.3.288 metadata fix

on:
  push:
    branches:
      - release/2.3.288

permissions:
  contents: write

jobs:
  fix-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/2.3.288
          fetch-depth: 0

      - name: Apply exact release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('agent/main.go')
          source = main.read_text()
          old = 'var Version = "2.2.196"'
          new = 'var Version = "2.2.197"'
          if new not in source:
              if old not in source:
                  raise SystemExit('agent/main.go version marker not found')
              main.write_text(source.replace(old, new, 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          heading = '## [2.3.288] - 2026-08-30'
          if heading not in text:
              prefix = '# Changelog\n\n'
              if not text.startswith(prefix):
                  raise SystemExit('CHANGELOG header not found')
              section = '''## [2.3.288] - 2026-08-30

### 新增

- 新增 NoBrand Provider 完整接入：ForwardX Agent 只读扫描 NoBrand-OneClick v3 固定状态目录，面板可查看 Mieru、Snell、Hysteria2 候选节点并显式选择导入。
- NoBrand 节点以 `external` 端点导入，支持稳定去重并继续复用 ForwardX 现有用户分配与统一订阅；ForwardX 不接管、不重启、不删除 NoBrand 运行时。
- 「协议接入」新增管理员 NoBrand Provider 扫描/选择/导入界面；普通 TLS VLESS Sudoku 等无法无损映射的节点继续 fail closed，不会错误转换为 Reality。

### 修复与优化

- Hysteria2 URI 与 Mihomo 订阅显式输出 `h3` ALPN，保持与服务端监听配置一致并提高客户端互操作性。
- NoBrand 扫描结果与凭据仅短暂保存在面板内存中，导入前重新校验 ownership、候选有效性和重复状态；扫描本身不写协议数据库。

### 版本

- 面板与 APK Release `2.3.288`，Agent `2.2.197`，ForwardX FXP runtime `2.2.114`，Android APP `2.3.97`。

'''
              changelog.write_text(prefix + section + text[len(prefix):])
          PY

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- agent/main.go CHANGELOG.md; then
            echo "Release metadata already correct"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/main.go CHANGELOG.md
          git commit -m "release: finalize v2.3.288 metadata"
          git push origin HEAD:release/2.3.288
