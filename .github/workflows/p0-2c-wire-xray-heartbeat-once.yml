name: P0-2C Wire Xray Heartbeat Once

on:
  push:
    branches:
      - fix/p0-2c-reality-multi-user
    paths:
      - .github/workflows/p0-2c-wire-xray-heartbeat-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/p0-2c-reality-multi-user
          fetch-depth: 0

      - name: Apply focused heartbeat wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/agentHeartbeatRoute.ts')
          text = path.read_text()

          replacements = [
              (
                  'runtime imports',
                  'import { buildManagedMieruRuntimePlan, buildManagedMihomoRuntimePlan, buildManagedProtocolGostServices } from "./protocolRuntimePlan";\n',
                  'import { buildManagedMieruRuntimePlan, buildManagedMihomoRuntimePlan, buildManagedProtocolGostServices } from "./protocolRuntimePlan";\nimport { buildManagedEntryRuntimePlans } from "./protocolManagedRuntimePlans";\nimport {\n  agentSupportsManagedXrayRuntime,\n  managedXrayRuntimeNeedsApply,\n  managedXrayRuntimeNeedsCleanup,\n  shouldDeferXrayForMihomoRealityHandoff,\n} from "./protocolXrayMigration";\nimport { buildManagedXrayRuntimeSyncAction } from "./protocolXrayRuntimeAction";\n',
              ),
              (
                  'xray reconcile interval',
                  'const AGENT_MIHOMO_RUNTIME_RECONCILE_MS = 5 * 60 * 1000;\nconst AGENT_MIMIC_RUNTIME_RECONCILE_MS = 5 * 60 * 1000;\n',
                  'const AGENT_MIHOMO_RUNTIME_RECONCILE_MS = 5 * 60 * 1000;\nconst AGENT_XRAY_RUNTIME_RECONCILE_MS = 5 * 60 * 1000;\nconst AGENT_MIMIC_RUNTIME_RECONCILE_MS = 5 * 60 * 1000;\n',
              ),
              (
                  'protocol access revisions',
                  '    const mihomoAccessRevision = Math.max(snellAccessRevision, realityAccessRevision, hysteria2AccessRevision);\n',
                  '    const xrayRuntimeSupported = agentSupportsManagedXrayRuntime(effectiveAgentVersion);\n    const mihomoAccessRevision = xrayRuntimeSupported\n      ? Math.max(snellAccessRevision, hysteria2AccessRevision)\n      : Math.max(snellAccessRevision, realityAccessRevision, hysteria2AccessRevision);\n    const xrayAccessRevision = xrayRuntimeSupported ? realityAccessRevision : 0;\n',
              ),
              (
                  'managed entry runtime plans',
                  '    const managedProtocolGostServices = buildManagedProtocolGostServices(managedProtocolEndpoints as any[]);\n    const managedMieruRuntimePlan = buildManagedMieruRuntimePlan(managedProtocolEndpoints as any[]);\n    const managedMihomoRuntimePlan = buildManagedMihomoRuntimePlan(managedProtocolEndpoints as any[]);\n',
                  '    const managedProtocolGostServices = buildManagedProtocolGostServices(managedProtocolEndpoints as any[]);\n    const managedMieruRuntimePlan = buildManagedMieruRuntimePlan(managedProtocolEndpoints as any[]);\n    const managedEntryRuntimePlans = xrayRuntimeSupported\n      ? buildManagedEntryRuntimePlans(managedProtocolEndpoints as any[])\n      : null;\n    const managedMihomoRuntimePlan = xrayRuntimeSupported\n      ? managedEntryRuntimePlans?.mihomo || null\n      : buildManagedMihomoRuntimePlan(managedProtocolEndpoints as any[]);\n    const managedXrayRuntimePlan = xrayRuntimeSupported\n      ? managedEntryRuntimePlans?.xray || null\n      : null;\n    const deferXrayForMihomoHandoff = xrayRuntimeSupported\n      && shouldDeferXrayForMihomoRealityHandoff(managedXrayRuntimePlan, localRuntimeState.state);\n    const xrayRuntimeNeedsApply = xrayRuntimeSupported\n      && managedXrayRuntimeNeedsApply(managedXrayRuntimePlan, localRuntimeState.state);\n    const xrayRuntimeNeedsCleanup = xrayRuntimeSupported\n      && managedXrayRuntimeNeedsCleanup(managedXrayRuntimePlan, localRuntimeState.state);\n',
              ),
              (
                  'runtime config changed flags',
                  '    const dnsRuntimeChanged = dnsChangedReports.length > 0;\n    const gostProtocolRuntimeConfigChanged = shadowsocksAccessRevision > Number(agentLastAppliedRevision || 0);\n    const mieruRuntimeConfigChanged = mieruAccessRevision > Number(agentLastAppliedRevision || 0);\n    const mihomoRuntimeConfigChanged = mihomoAccessRevision > Number(agentLastAppliedRevision || 0);\n',
                  '    const dnsRuntimeChanged = dnsChangedReports.length > 0;\n    const gostProtocolRuntimeConfigChanged = shadowsocksAccessRevision > Number(agentLastAppliedRevision || 0);\n    const mieruRuntimeConfigChanged = mieruAccessRevision > Number(agentLastAppliedRevision || 0);\n    const mihomoRuntimeConfigChanged = mihomoAccessRevision > Number(agentLastAppliedRevision || 0)\n      || deferXrayForMihomoHandoff;\n    const xrayRuntimeConfigChanged = xrayAccessRevision > Number(agentLastAppliedRevision || 0)\n      || xrayRuntimeNeedsApply\n      || xrayRuntimeNeedsCleanup;\n',
              ),
          ]

          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          anchor = '    if (!deferActionsForLocalState && mimicRuntimeSyncWanted) {\n'
          xray_block = (
              '    const xrayDesiredRelevant = !!managedXrayRuntimePlan;\n'
              '    const xrayPeriodicReconcileDue = xrayDesiredRelevant && runtimeSyncReconcileDue(\n'
              '      Number(host.id),\n'
              '      "xray-runtime-sync",\n'
              '      responseIssuedAt,\n'
              '      AGENT_XRAY_RUNTIME_RECONCILE_MS,\n'
              '    );\n'
              '    const xrayRuntimeRelevant = xrayRuntimeSupported\n'
              '      && (xrayDesiredRelevant || xrayRuntimeConfigChanged);\n'
              '    if (!deferActionsForLocalState\n'
              '      && xrayRuntimeRelevant\n'
              '      && !deferXrayForMihomoHandoff\n'
              '      && (xrayRuntimeConfigChanged || runtimeSyncBootstrap || xrayPeriodicReconcileDue)) {\n'
              '      const xrayRuntimeSyncAction = buildManagedXrayRuntimeSyncAction(managedXrayRuntimePlan) as any;\n'
              '      if (shouldSendRuntimeSyncAction(\n'
              '        Number(host.id),\n'
              '        xrayRuntimeSyncAction,\n'
              '        xrayRuntimeConfigChanged || runtimeSyncBootstrap,\n'
              '        responseIssuedAt,\n'
              '        AGENT_XRAY_RUNTIME_RECONCILE_MS,\n'
              '      )) actions.push(xrayRuntimeSyncAction);\n'
              '    }\n'
          )
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'xray runtime sync insertion: expected exactly 1 match, found {count}')
          text = text.replace(anchor, xray_block + anchor, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff --stat
          git diff -- server/agentHeartbeatRoute.ts | sed -n '1,360p'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify heartbeat and protocol runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsc --noEmit
          node --import tsx --test server/protocolXrayMigration.test.ts server/protocolManagedRuntimePlans.test.ts server/protocolXrayRuntimeAction.test.ts server/protocolRuntimeStatus.test.ts
          pnpm test:protocol-access
          pnpm build

      - name: Commit focused patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p0-2c-wire-xray-heartbeat-once.yml
          git add server/agentHeartbeatRoute.ts
          git commit -m 'feat(p0-2c): wire migration-safe Xray desired state'
          git push origin HEAD:fix/p0-2c-reality-multi-user
