name: Release Agent

on:
  workflow_dispatch:
    inputs:
      force_agent_rebuild:
        description: Force rebuilding Agent/FXP/runtime assets
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "forwardx-fxp/**"
      - "shared/versions.ts"
      - "scripts/build-agent-release.sh"
      - "scripts/detect-agent-release-input-changes.mjs"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/release-agent.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: forwardx-release-agent-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-agent-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release versions
        run: npm run check:versions

      - name: Inspect target Release assets
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          agent_assets_complete=false
          panel_bundle_exists=false
          asset_names=(
            forwardx-agent-linux-amd64
            forwardx-agent-linux-arm64
            forwardx-fxp-linux-amd64
            forwardx-fxp-linux-arm64
            forwardx-runtime-linux-amd64
            forwardx-runtime-linux-arm64
            SHA256SUMS
            THIRD_PARTY_NOTICES.md
          )

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            names="$(gh release view "$RELEASE_VERSION" --json assets --jq '.assets[].name')"
            agent_assets_complete=true
            for name in "${asset_names[@]}"; do
              if ! grep -Fxq "$name" <<< "$names"; then
                agent_assets_complete=false
                break
              fi
            done
            panel_bundle="forwardx-panel-${RELEASE_VERSION}.tar.gz"
            if grep -Fxq "$panel_bundle" <<< "$names"; then
              panel_bundle_exists=true
            fi
          fi

          echo "agent_assets_complete=$agent_assets_complete" >> "$GITHUB_OUTPUT"
          echo "panel_bundle_exists=$panel_bundle_exists" >> "$GITHUB_OUTPUT"
          echo "Target release Agent assets complete: $agent_assets_complete"
          echo "Target release panel bundle exists: $panel_bundle_exists"

      - name: Resolve previous reusable Agent Release
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          asset_names=(
            forwardx-agent-linux-amd64
            forwardx-agent-linux-arm64
            forwardx-fxp-linux-amd64
            forwardx-fxp-linux-arm64
            forwardx-runtime-linux-amd64
            forwardx-runtime-linux-arm64
            SHA256SUMS
            THIRD_PARTY_NOTICES.md
          )

          source_release=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" != "$RELEASE_VERSION" ] || continue
            names="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            complete=true
            for name in "${asset_names[@]}"; do
              if ! grep -Fxq "$name" <<< "$names"; then
                complete=false
                break
              fi
            done
            if [ "$complete" = "true" ]; then
              source_release="$tag"
              break
            fi
          done < <(gh release list --limit 100 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')

          echo "release=$source_release" >> "$GITHUB_OUTPUT"
          echo "Previous reusable Agent Release: ${source_release:-none}"

      - name: Detect Agent release input changes
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_AGENT_REBUILD: ${{ inputs.force_agent_rebuild }}
          SOURCE_RELEASE: ${{ steps.source.outputs.release }}
        run: |
          set -euo pipefail
          build=false
          if [ "${FORCE_AGENT_REBUILD:-false}" = "true" ]; then
            build=true
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "${SOURCE_RELEASE:-}" ]; then
              build=true
            elif ! git rev-parse --verify "${SOURCE_RELEASE}^{commit}" >/dev/null 2>&1; then
              echo "Previous reusable Release tag ${SOURCE_RELEASE} is unavailable locally; rebuilding safely."
              build=true
            else
              build="$(node scripts/detect-agent-release-input-changes.mjs "$SOURCE_RELEASE" "$GITHUB_SHA")"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Agent binary rebuild required: $build"

      - name: Require a new panel release for changed Agent assets
        if: steps.inputs.outputs.build == 'true' && github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            exit 0
          fi
          current_version="$(node -p "require('./package.json').version")"
          previous_version="$(git show "${BEFORE_SHA}:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          if [ "$current_version" = "$previous_version" ]; then
            echo "::error::Agent release inputs changed without advancing the panel release version. Bump APP/package release version so immutable release assets are not overwritten."
            exit 1
          fi

      - name: Setup Go
        if: steps.inputs.outputs.build == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            agent/go.mod
            forwardx-fxp/go.mod
            forwardx-fxp/go.sum

      - name: Run Agent tests and vet
        if: steps.inputs.outputs.build == 'true'
        shell: bash
        run: |
          (cd agent && go test ./... && go vet ./...)
          (cd forwardx-fxp && go test ./... && go vet ./...)

      - name: Build Linux Agent binaries
        if: steps.inputs.outputs.build == 'true'
        run: bash scripts/build-agent-release.sh

      - name: Reuse unchanged Agent assets from previous Release
        if: steps.inputs.outputs.build != 'true' && steps.target.outputs.agent_assets_complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_RELEASE: ${{ steps.source.outputs.release }}
        run: |
          set -euo pipefail
          asset_names=(
            forwardx-agent-linux-amd64
            forwardx-agent-linux-arm64
            forwardx-fxp-linux-amd64
            forwardx-fxp-linux-arm64
            forwardx-runtime-linux-amd64
            forwardx-runtime-linux-arm64
            SHA256SUMS
            THIRD_PARTY_NOTICES.md
          )

          if [ -z "${SOURCE_RELEASE:-}" ]; then
            echo "::error::No previous ForwardX Release contains a complete Agent asset set to reuse"
            exit 1
          fi

          echo "Reusing unchanged Agent assets from ${SOURCE_RELEASE} for ${RELEASE_VERSION}"
          mkdir -p dist/agent
          for name in "${asset_names[@]}"; do
            gh release download "$SOURCE_RELEASE" --pattern "$name" --dir dist/agent
          done

          while read -r expected recorded_path; do
            [ -n "${expected:-}" ] || continue
            name="$(basename "$recorded_path")"
            if [ ! -f "dist/agent/$name" ]; then
              echo "::error::Checksum references missing reused asset: $name"
              exit 1
            fi
            actual="$(sha256sum "dist/agent/$name" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Checksum mismatch for reused asset: $name"
              exit 1
            fi
            echo "$name: OK"
          done < dist/agent/SHA256SUMS

      - name: Ensure target GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_VERSION" \
              --notes "ForwardX $RELEASE_VERSION"
          fi

      - name: Upload Agent assets to GitHub Release
        if: steps.inputs.outputs.build == 'true' || steps.target.outputs.agent_assets_complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          files=(
            dist/agent/forwardx-agent-linux-amd64
            dist/agent/forwardx-agent-linux-arm64
            dist/agent/forwardx-fxp-linux-amd64
            dist/agent/forwardx-fxp-linux-arm64
            dist/agent/forwardx-runtime-linux-amd64
            dist/agent/forwardx-runtime-linux-arm64
            dist/agent/SHA256SUMS
            dist/agent/THIRD_PARTY_NOTICES.md
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing release artifact: $file" >&2
              exit 1
            fi
          done

          upload_with_retry() {
            local attempt=1
            local max_attempts=5
            local delay=8
            until gh release upload "$RELEASE_VERSION" "${files[@]}" --clobber; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "GitHub Release upload failed after ${attempt} attempts" >&2
                return 1
              fi
              echo "GitHub Release upload failed, retrying in ${delay}s (attempt ${attempt}/${max_attempts})..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          upload_with_retry

      - name: Dispatch missing Panel release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          panel_bundle="forwardx-panel-${RELEASE_VERSION}.tar.gz"
          names="$(gh release view "$RELEASE_VERSION" --json assets --jq '.assets[].name')"
          if grep -Fxq "$panel_bundle" <<< "$names"; then
            echo "Panel bundle already exists for ${RELEASE_VERSION}; no dispatch needed."
            exit 0
          fi
          echo "Panel bundle is missing for ${RELEASE_VERSION}; dispatching Release Panel explicitly."
          gh workflow run release-panel.yml --ref main
