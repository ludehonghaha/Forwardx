              '                  <Input type="password" value={endpointForm.password} onChange={(event) => setEndpointForm({ ...endpointForm, password: event.target.value })} autoComplete="new-password" />\n'
              '                  <p className="text-xs text-muted-foreground">\n'
              '                    {endpointForm.runtimeMode === "managed" ? "托管运行时只保存这一份共享凭据；用户分配只控制订阅权限。" : "留空时必须在“用户分配”中为每个用户填写独立密码。"}\n'
              '                  </p>\n'
              '                </div>\n'
              '              )}',
