name: Codex Auto Managed Protocol Port

on:
  push:
    branches:
      - codex/auto-managed-protocol-port
    paths:
      - '.github/workflows/codex-auto-managed-protocol-port.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auto-managed-protocol-port
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply patch
        run: python3 scripts/codex-auto-managed-protocol-port.py
      - name: Verify
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test:protocol-access
          pnpm build
      - name: Commit formal patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/codex-auto-managed-protocol-port.py
          rm -f .github/workflows/codex-auto-managed-protocol-port.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(protocol): auto allocate managed endpoint ports'
          git push origin HEAD:codex/auto-managed-protocol-port
