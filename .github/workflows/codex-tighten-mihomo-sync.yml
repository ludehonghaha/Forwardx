name: Codex Tighten Mihomo Sync

on:
  push:
    branches:
      - codex/feature-managed-entry-protocols
    paths:
      - .github/workflows/codex-tighten-mihomo-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/feature-managed-entry-protocols
          fetch-depth: 0
      - name: Patch Mihomo revision scoping
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("server/agentHeartbeatRoute.ts")
          s = p.read_text()

          def one(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"expected exactly one match, found {n}: {old!r}")
              s = s.replace(old, new, 1)

          one(
              '    const [rawRules, hostTunnels, forwardProtocolSettings, configRevision, managedProtocolEndpoints, shadowsocksAccessRevision, mieruAccessRevision, mihomoAccessRevision] = await Promise.all([',
              '    const [rawRules, hostTunnels, forwardProtocolSettings, configRevision, managedProtocolEndpoints, shadowsocksAccessRevision, mieruAccessRevision, snellAccessRevision, realityAccessRevision, hysteria2AccessRevision] = await Promise.all([',
          )
          one(
              '      latestHostProtocolAccessRevision(Number(host.id)),\n    ]);\n    const rules = await gateForwardRulesForRuntime(rawRules as any[]);',
              '      latestHostProtocolAccessRevision(Number(host.id), "snell"),\n      latestHostProtocolAccessRevision(Number(host.id), "vless_reality"),\n      latestHostProtocolAccessRevision(Number(host.id), "hysteria2"),\n    ]);\n    const mihomoAccessRevision = Math.max(snellAccessRevision, realityAccessRevision, hysteria2AccessRevision);\n    const rules = await gateForwardRulesForRuntime(rawRules as any[]);',
          )
          one(
              '    if (!deferActionsForLocalState && (mihomoRuntimeConfigChanged || runtimeSyncBootstrap || mihomoPeriodicReconcileDue)) {',
              '    const mihomoRuntimeRelevant = mihomoDesiredRelevant || mihomoRuntimeConfigChanged;\n    if (!deferActionsForLocalState && mihomoRuntimeRelevant\n      && (mihomoRuntimeConfigChanged || runtimeSyncBootstrap || mihomoPeriodicReconcileDue)) {',
          )

          p.write_text(s)
          Path(".github/workflows/codex-tighten-mihomo-sync.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(protocol): scope Mihomo sync to Mihomo entry protocols"
          git push origin HEAD:codex/feature-managed-entry-protocols
