name: Release 2.3.284 Once

on:
  push:
    branches:
      - codex/release-2.3.284
    paths:
      - .github/workflows/release-2.3.284-once.yml

permissions:
  contents: write

jobs:
  bump-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/release-2.3.284
          fetch-depth: 0

      - name: Apply release version bump
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          if pkg.get('version') != '2.3.283':
              raise SystemExit(f"package.json expected 2.3.283, got {pkg.get('version')}")
          pkg['version'] = '2.3.284'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          versions_path = Path('shared/versions.ts')
          versions = versions_path.read_text()
          replacements = {
              'export const APP_VERSION = "2.3.283";': 'export const APP_VERSION = "2.3.284";',
              'export const ANDROID_APK_RELEASE_VERSION = "2.3.283";': 'export const ANDROID_APK_RELEASE_VERSION = "2.3.284";',
              'export const AGENT_VERSION = "2.2.194";': 'export const AGENT_VERSION = "2.2.195";',
          }
          for old, new in replacements.items():
              if versions.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for: {old}')
              versions = versions.replace(old, new, 1)
          versions_path.write_text(versions)

          agent_path = Path('agent/main.go')
          agent = agent_path.read_text()
          old_agent = 'var Version = "2.2.194"'
          new_agent = 'var Version = "2.2.195"'
          if agent.count(old_agent) != 1:
              raise SystemExit('agent version marker mismatch')
          agent_path.write_text(agent.replace(old_agent, new_agent, 1))

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          marker = '# Changelog\n\n'
          if not changelog.startswith(marker):
              raise SystemExit('unexpected CHANGELOG header')
          section = '''## [2.3.284] - 2026-08-27

### 新增

- 托管 Mieru 支持同一端点、同一监听端口分配给多个 ForwardX 用户，并为每个分配自动维护独立用户名与密码；首个既有用户可平滑继承旧凭据，避免迁移中断。
- Mita 单运行时可同时下发多个用户，Agent 读取 Mieru 原生 per-user metrics 并按用户独立累计流量、更新 `trafficUsed` 与协议流量 bucket。
- 用户启用、停用、到期或超限只影响对应 Mieru 用户，不会重建端点或影响同端口其他用户；重新启用后保留原独立凭据。

### 修复与优化

- 修复 Mieru Reporter 未继承 Mita UDS 环境变量导致无法读取真实 per-user metrics 的问题。
- 修复协议流量 claim 与 legacy traffic claim 共用原始 reportId 引发唯一约束冲突、HTTP ACK 失败和 pending 重试的问题；legacy claim 使用独立命名空间并保持旧 pending 幂等恢复。
- 修复托管 Mieru 用户启用/停用时前端错误回传用户名与密码、被后端凭据保护拒绝的问题；托管凭据继续只由 ForwardX 自动管理。

### 版本

- 面板与 APK Release `2.3.284`，Agent `2.2.195`，ForwardX FXP runtime `2.2.114`，Android APP `2.3.97`。

'''
          changelog_path.write_text(marker + section + changelog[len(marker):])
          PY

          git diff --check
          git diff -- package.json shared/versions.ts agent/main.go CHANGELOG.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify version invariants
        run: npm run check:versions

      - name: Commit release bump and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-2.3.284-once.yml
          git add package.json shared/versions.ts agent/main.go CHANGELOG.md
          git commit -m 'chore(release): bump 2.3.284 and agent 2.2.195'
          git push origin HEAD:codex/release-2.3.284
