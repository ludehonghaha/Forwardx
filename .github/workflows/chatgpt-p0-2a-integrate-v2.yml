name: ChatGPT P0-2A Integrate v2

on:
  push:
    branches:
      - chatgpt/p0-2a-carrier-probes
    paths:
      - .github/workflows/chatgpt-p0-2a-integrate-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/p0-2a-carrier-probes
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Apply integration patch
        run: node scripts/apply-p0-2a-carrier-probes.mjs

      - name: Narrow generated manager metadata type
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'client/src/components/hosts/HostProbeServiceManager.tsx';
          let source = fs.readFileSync(file, 'utf8');
          const from = 'probeKind: service?.probeKind === "china_carrier" ? "china_carrier" : "custom",';
          const to = 'probeKind: (service?.probeKind === "china_carrier" ? "china_carrier" : "custom") as HostProbeKind,';
          if (!source.includes(from)) throw new Error('manager probeKind type anchor missing');
          source = source.replace(from, to);
          fs.writeFileSync(file, source);
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify focused tests and types
        run: |
          node --import tsx --test server/hostProbeMetadata.test.ts
          pnpm exec tsc --noEmit
          pnpm test:server

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/schema.ts server/dbSchema.ts server/db.ts server/repositories/hostProbeServiceRepository.ts server/routers/hosts.ts client/src/components/hosts/HostProbeServiceManager.tsx client/src/pages/Hosts.tsx
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat(probes): integrate China carrier quality views"
          git push origin HEAD:chatgpt/p0-2a-carrier-probes
