name: P1 Route Patch

on:
  push:
    branches:
      - fix/p1-finalize-stopped-rules
    paths:
      - .github/workflows/p1-route-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p1-finalize-stopped-rules
          fetch-depth: 0

      - name: Apply guarded heartbeat replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/agentHeartbeatRoute.ts')
          text = path.read_text()

          old_import = 'import { resolveLocalForwardXTransportVersion, resolveRuleTrafficPortForHost } from "./agentRuntimeRuleState";'
          new_import = '''import {
            resolveLocalForwardXTransportVersion,
            resolveRuleTrafficPortForHost,
            stoppedForwardRuleNeedsRemoval,
          } from "./agentRuntimeRuleState";'''
          if text.count(old_import) != 1:
              raise SystemExit(f'import replacement count={text.count(old_import)}; expected 1')

          needle = 'const localRuleNeedsRemoval = (rule: any) => {'
          if text.count(needle) != 1:
              raise SystemExit(f'function start count={text.count(needle)}; expected 1')
          start = text.index(needle)
          line_start = text.rfind('\n', 0, start) + 1
          indent = text[line_start:start]
          end_marker = '\n' + indent + '};'
          end = text.index(end_marker, start) + len(end_marker)
          old_fn = text[line_start:end]

          required_old_lines = [
              'if (!hasReportedRuntimeState) return true;',
              'if (!local) return true;',
              'if (isKernelForwardRule(rule)) return true;',
              'return Number(local.ruleId || 0) === Number(rule?.id || 0);',
          ]
          missing = [line for line in required_old_lines if line not in old_fn]
          if missing:
              raise SystemExit(f'guard mismatch in localRuleNeedsRemoval: {missing}')

          i = indent
          new_fn = (
              f'{i}const localRuleNeedsRemoval = (rule: any) => {{\n'
              f'{i}  const port = Number(rule?.sourcePort || 0);\n'
              f'{i}  const local = port > 0\n'
              f'{i}    ? findLocalRuleState(port, rule.protocol, Number(rule?.id || 0))\n'
              f'{i}    : undefined;\n'
              f'{i}  return stoppedForwardRuleNeedsRemoval({{\n'
              f'{i}    hasReportedRuntimeState,\n'
              f'{i}    sourcePort: port,\n'
              f'{i}    kernelForwardRule: isKernelForwardRule(rule),\n'
              f'{i}    expectedRuleId: rule?.id,\n'
              f'{i}    localRuleId: local?.ruleId,\n'
              f'{i}  }});\n'
              f'{i}}};'
          )

          text = text.replace(old_import, new_import, 1)
          text = text[:line_start] + new_fn + text[end:]
          path.write_text(text)
          PY

          git diff --check
          git diff -- server/agentHeartbeatRoute.ts

      - name: Commit heartbeat integration
        shell: bash
        run: |
          if git diff --quiet -- server/agentHeartbeatRoute.ts; then
            echo "No route change to commit"
            exit 0
          fi
          git config user.name "ForwardX P1 Patch"
          git config user.email "actions@users.noreply.github.com"
          git add server/agentHeartbeatRoute.ts
          git commit -m "fix: finalize stopped rules from runtime absence"
          git push origin HEAD:fix/p1-finalize-stopped-rules
