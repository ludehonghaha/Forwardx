name: P1 Route Patch

on:
  push:
    branches:
      - fix/p1-finalize-stopped-rules
    paths:
      - .github/workflows/p1-route-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p1-finalize-stopped-rules
          fetch-depth: 0

      - name: Apply exact heartbeat replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/agentHeartbeatRoute.ts')
          text = path.read_text()

          old_import = 'import { resolveLocalForwardXTransportVersion, resolveRuleTrafficPortForHost } from "./agentRuntimeRuleState";'
          new_import = '''import {
            resolveLocalForwardXTransportVersion,
            resolveRuleTrafficPortForHost,
            stoppedForwardRuleNeedsRemoval,
          } from "./agentRuntimeRuleState";'''

          old_fn = '''    const localRuleNeedsRemoval = (rule: any) => {
              if (!hasReportedRuntimeState) return true;
              const port = Number(rule?.sourcePort || 0);
              if (port <= 0) return true;
              const local = findLocalRuleState(port, rule.protocol, Number(rule?.id || 0));
              if (!local) return true;
              if (isKernelForwardRule(rule)) return true;
              return Number(local.ruleId || 0) === Number(rule?.id || 0);
            };'''
          new_fn = '''    const localRuleNeedsRemoval = (rule: any) => {
              const port = Number(rule?.sourcePort || 0);
              const local = port > 0
                ? findLocalRuleState(port, rule.protocol, Number(rule?.id || 0))
                : undefined;
              return stoppedForwardRuleNeedsRemoval({
                hasReportedRuntimeState,
                sourcePort: port,
                kernelForwardRule: isKernelForwardRule(rule),
                expectedRuleId: rule?.id,
                localRuleId: local?.ruleId,
              });
            };'''

          if text.count(old_import) != 1:
              raise SystemExit(f'import replacement count={text.count(old_import)}; expected 1')
          if text.count(old_fn) != 1:
              raise SystemExit(f'function replacement count={text.count(old_fn)}; expected 1')

          text = text.replace(old_import, new_import, 1).replace(old_fn, new_fn, 1)
          path.write_text(text)
          PY

          git diff --check
          git diff -- server/agentHeartbeatRoute.ts

      - name: Commit heartbeat integration
        shell: bash
        run: |
          if git diff --quiet -- server/agentHeartbeatRoute.ts; then
            echo "No route change to commit"
            exit 0
          fi
          git config user.name "ForwardX P1 Patch"
          git config user.email "actions@users.noreply.github.com"
          git add server/agentHeartbeatRoute.ts
          git commit -m "fix: finalize stopped rules from runtime absence"
          git push origin HEAD:fix/p1-finalize-stopped-rules
