name: P1 Route Patch

on:
  push:
    branches:
      - fix/p1-finalize-stopped-rules
    paths:
      - .github/workflows/p1-route-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p1-finalize-stopped-rules
          fetch-depth: 0

      - name: Restore canonical heartbeat block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('server/agentHeartbeatRoute.ts')
          current = path.read_text()
          main = subprocess.check_output(['git', 'show', 'origin/main:server/agentHeartbeatRoute.ts'], text=True)

          start_anchor = '    const buildGenericLocalTunnelRemovalAction = (local: AgentLocalRuntimeTunnelState) => {'
          end_anchor = '    const shouldForceStoppedKernelRuleCleanup ='
          local_anchor = '    const localRuleNeedsRemoval = (rule: any) => {'

          for label, text in [('current', current), ('main', main)]:
              assert text.count(start_anchor) == 1, (label, 'start', text.count(start_anchor))
              assert text.count(end_anchor) == 1, (label, 'end', text.count(end_anchor))

          ms = main.index(start_anchor)
          me = main.index(end_anchor, ms)
          canonical = main[ms:me]
          ls = canonical.index(local_anchor)
          old_local = canonical[ls:]
          assert 'if (!hasReportedRuntimeState) return true;' in old_local
          assert 'if (!local) return true;' in old_local
          assert 'stoppedForwardRuleNeedsRemoval' not in old_local

          new_fn = '\n'.join([
              '    const localRuleNeedsRemoval = (rule: any) => {',
              '      const port = Number(rule?.sourcePort || 0);',
              '      const local = port > 0',
              '        ? findLocalRuleState(port, rule.protocol, Number(rule?.id || 0))',
              '        : undefined;',
              '      return stoppedForwardRuleNeedsRemoval({',
              '        hasReportedRuntimeState,',
              '        sourcePort: port,',
              '        kernelForwardRule: isKernelForwardRule(rule),',
              '        expectedRuleId: rule?.id,',
              '        localRuleId: local?.ruleId,',
              '      });',
              '    };',
              '',
          ])
          replacement = canonical[:ls] + new_fn

          cs = current.index(start_anchor)
          ce = current.index(end_anchor, cs)
          repaired = current[:cs] + replacement + current[ce:]

          assert repaired.count(local_anchor) == 1
          assert repaired.count('stoppedForwardRuleNeedsRemoval({') == 1
          assert repaired.count('  stoppedForwardRuleNeedsRemoval,\n} from "./agentRuntimeRuleState";') == 1
          path.write_text(repaired)
          PY

          git diff --check
          git diff -- server/agentHeartbeatRoute.ts

      - name: Commit heartbeat repair
        shell: bash
        run: |
          git config user.name "ForwardX P1 Patch"
          git config user.email "actions@users.noreply.github.com"
          git add server/agentHeartbeatRoute.ts
          git commit -m "fix: repair stopped rule heartbeat integration"
          git push origin HEAD:fix/p1-finalize-stopped-rules
