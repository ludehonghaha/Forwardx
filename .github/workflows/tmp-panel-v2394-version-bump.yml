name: Temporary Panel v2.3.294 Version Bump

on:
  push:
    branches:
      - release/panel-v2.3.294
    paths:
      - ".github/workflows/tmp-panel-v2394-version-bump.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/panel-v2.3.294
          fetch-depth: 0

      - name: Prepare v2.3.294 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          package = Path('package.json')
          text = package.read_text()
          old = '"version": "2.3.293"'
          new = '"version": "2.3.294"'
          if old not in text:
              raise SystemExit('package.json expected version not found')
          package.write_text(text.replace(old, new, 1))

          versions = Path('shared/versions.ts')
          text = versions.read_text()
          text = text.replace('export const APP_VERSION = "2.3.293";', 'export const APP_VERSION = "2.3.294";', 1)
          text = text.replace('export const ANDROID_APK_RELEASE_VERSION = "2.3.293";', 'export const ANDROID_APK_RELEASE_VERSION = "2.3.294";', 1)
          if 'APP_VERSION = "2.3.294"' not in text or 'ANDROID_APK_RELEASE_VERSION = "2.3.294"' not in text:
              raise SystemExit('shared/versions.ts version replacement failed')
          versions.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## [2.3.294]' in text:
              raise SystemExit('CHANGELOG already contains 2.3.294')
          marker = '# Changelog\n\n'
          if not text.startswith(marker):
              raise SystemExit('unexpected CHANGELOG header')
          section = '''## [2.3.294] - 2026-09-03

### 修复与优化

- 三网目标探测首页改为按电信、联通、移动分组，每台服务器独立显示当前 RTT、Ping 丢包 / TCP 失败和 24 小时小趋势，避免所有主机与三网曲线叠在同一张总图。
- 新增单机三网视图：同一台服务器用三个状态摘要卡配合一张 24 小时 RTT 图，同时展示电信、联通、移动三条曲线，并继续区分 Ping 丢包与 TCPing 连接失败语义。
- 新增双机总对比：最多选择两台服务器，分别按电信、联通、移动进行 RTT 横向比较，保留当前 RTT 与失败率摘要。
- 保留地区筛选、P95 聚焦正常量程与完整尖峰量程；本次仅调整展示层，不修改数据库、Agent 协议、探测调度或历史数据语义。

### 版本

- 面板与 APK Release `2.3.294`，Agent `2.2.199`，ForwardX FXP runtime `2.2.114`，Android APP `2.3.97`。

'''
          changelog.write_text(marker + section + text[len(marker):])
          PY

      - name: Verify release metadata
        run: node scripts/check-versions.mjs

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json shared/versions.ts CHANGELOG.md
          git commit -m "chore(release): prepare panel v2.3.294"
          git push origin HEAD:release/panel-v2.3.294
