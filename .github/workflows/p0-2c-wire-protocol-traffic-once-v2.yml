name: P0-2C Wire Protocol Traffic Once V2

on:
  push:
    branches:
      - fix/p0-2c-reality-multi-user
    paths:
      - .github/workflows/p0-2c-wire-protocol-traffic-once-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/p0-2c-reality-multi-user
          fetch-depth: 0

      - name: Patch protocol traffic route
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server/agentReportRoutes.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { getAgentHostIdentityFromRequest } from "./agentAuth";',
              'import { getAgentHostIdentityFromRequest, getResolvedAgentToken } from "./agentAuth";',
              'agent auth import',
          )
          replace_once(
              'import { selectAgentTrafficReportInterval } from "./agentHeartbeatGate";\n',
              'import { selectAgentTrafficReportInterval } from "./agentHeartbeatGate";\n'
              'import {\n'
              '  accountAgentProtocolTrafficReport,\n'
              '  AgentProtocolTrafficValidationError,\n'
              '} from "./agentProtocolTrafficAccounting";\n',
              'protocol accounting import',
          )
          replace_once(
              '    if (!Array.isArray(req.body?.stats) && !Array.isArray(req.body?.s) && !hostTraffic) {',
              '    const hasProtocolTrafficPayload =\n'
              '      req.body?.protocolStats !== undefined || req.body?.mieruStats !== undefined;\n'
              '    if (!Array.isArray(req.body?.stats) && !Array.isArray(req.body?.s) && !hostTraffic && !hasProtocolTrafficPayload) {',
              'traffic payload gate',
          )
          replace_once(
              '      res.status(400).json({ error: "stats array or hostTraffic is required" });',
              '      res.status(400).json({ error: "stats array, hostTraffic, or protocol traffic is required" });',
              'traffic payload error',
          )
          replace_once(
              '    // An idle Agent may only report the host-wide network counters. Avoid\n',
              '    let protocolTrafficResult: Awaited<ReturnType<typeof accountAgentProtocolTrafficReport>> | null = null;\n'
              '    if (hasProtocolTrafficPayload) {\n'
              '      protocolTrafficResult = await accountAgentProtocolTrafficReport({\n'
              '        token: String(getResolvedAgentToken(req) || ""),\n'
              '        body: req.body,\n'
              '      });\n'
              '    }\n\n'
              '    // A protocol-only report must not fall through to the generic idle\n'
              '    // traffic claim. The protocol accounting transaction above is the ACK\n'
              '    // boundary for assignment traffic and owns its own producer namespace.\n'
              '    if (stats.length === 0 && !hostTraffic && hasProtocolTrafficPayload) {\n'
              '      res.json({\n'
              '        success: true,\n'
              '        ...(protocolTrafficResult?.duplicate ? { duplicate: true } : {}),\n'
              '      });\n'
              '      return;\n'
              '    }\n\n'
              '    // An idle Agent may only report the host-wide network counters. Avoid\n',
              'idle traffic anchor',
          )
          replace_once(
              '    console.error(`[Agent Traffic] Error host=${logHostId || "-"} name=${logHostName || "-"}:`, error);',
              '    if (error instanceof AgentProtocolTrafficValidationError) {\n'
              '      res.status(error.statusCode).json({ error: error.message });\n'
              '      return;\n'
              '    }\n'
              '    console.error(`[Agent Traffic] Error host=${logHostId || "-"} name=${logHostName || "-"}:`, error);',
              'traffic validation catch',
          )
          path.write_text(text)
          PY

      - name: Reuse protocol traffic route integration test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p0-2c-wire-protocol-traffic-once.yml').read_text()
          start_marker = "          cat > server/agentProtocolTrafficRoute.test.ts <<'EOF'\n"
          end_marker = "          EOF\n\n      - name: Setup pnpm"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('integration test heredoc markers are not unique')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          normalized = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"
          Path('server/agentProtocolTrafficRoute.test.ts').write_text(normalized)
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Panel protocol accounting
        run: |
          pnpm exec tsc --noEmit
          node --import tsx --test \
            server/agentProtocolTrafficAccounting.test.ts \
            server/agentProtocolTrafficRoute.test.ts \
            server/protocolXrayPlan.test.ts \
            server/protocolXrayMigration.test.ts \
            server/protocolXrayRuntimeAction.test.ts
          pnpm build

      - name: Verify Agent reporter
        working-directory: agent
        run: |
          go test ./...
          go vet ./...

      - name: Commit verified wiring and remove one-shot workflows
        shell: bash
        run: |
          rm .github/workflows/p0-2c-wire-protocol-traffic-once.yml
          rm .github/workflows/p0-2c-wire-protocol-traffic-once-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/agentReportRoutes.ts server/agentProtocolTrafficRoute.test.ts .github/workflows/p0-2c-wire-protocol-traffic-once.yml .github/workflows/p0-2c-wire-protocol-traffic-once-v2.yml
          git commit -m "fix(p0-2c): account protocol traffic before ACK"
          git push origin HEAD:fix/p0-2c-reality-multi-user
