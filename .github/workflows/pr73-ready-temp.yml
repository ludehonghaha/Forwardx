name: PR73 Ready Temporary

on:
  push:
    branches:
      - fix/advanced-probe-carrier-history

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 73 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 73 --repo "$GITHUB_REPOSITORY"
