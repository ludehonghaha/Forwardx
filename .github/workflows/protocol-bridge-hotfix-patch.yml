name: protocol-bridge-hotfix-patch

on:
  push:
    branches:
      - fix/protocol-traffic-bridge-runtime-acl
    paths:
      - .github/workflows/protocol-bridge-hotfix-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/protocol-traffic-bridge-runtime-acl
          fetch-depth: 0
      - name: Apply hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "server/linkAccessView.ts",
              "  hosts,\n  tunnelExitNodes,",
              "  hosts,\n  protocolEndpoints,\n  protocolUserAccess,\n  tunnelExitNodes,",
          )
          replace_once(
              "server/linkAccessView.ts",
              'import { getDb } from "./dbRuntime";\n',
              'import { getDb } from "./dbRuntime";\nimport { isTrustedProtocolTrafficBridgeRuntimeRule } from "./protocolTrafficBridgeTrust";\n',
          )

          anchor = dedent('''\
          /**
           * Runtime rows keep their persisted enabled flag, but an Agent must treat a
           * rule whose root resource is no longer authorized as disabled. Returning
           * cloned denied rows lets the normal removal path clean up an existing
           * listener without hiding or mutating the user's saved rule.
           */
          ''')
          helper = dedent('''\
          async function trustedProtocolTrafficBridgeRuleIds(db: any, rules: Array<Record<string, any>>) {
            const ruleIds = Array.from(new Set(rules
              .map((rule) => positiveId(rule?.id))
              .filter((ruleId) => ruleId > 0)));
            if (ruleIds.length === 0) return new Set<number>();

            try {
              const endpoints = await db.select({
                id: protocolEndpoints.id,
                runtimeMode: protocolEndpoints.runtimeMode,
                hostId: protocolEndpoints.hostId,
                forwardRuleId: protocolEndpoints.forwardRuleId,
                publicPort: protocolEndpoints.publicPort,
                configJson: protocolEndpoints.configJson,
                isEnabled: protocolEndpoints.isEnabled,
              }).from(protocolEndpoints)
                .where(inArray(protocolEndpoints.forwardRuleId, ruleIds));
              if (endpoints.length === 0) return new Set<number>();

              const endpointIds = endpoints
                .map((endpoint: any) => positiveId(endpoint?.id))
                .filter((endpointId: number) => endpointId > 0);
              const assignments = endpointIds.length > 0
                ? await db.select({
                    endpointId: protocolUserAccess.endpointId,
                    userId: protocolUserAccess.userId,
                    isEnabled: protocolUserAccess.isEnabled,
                  }).from(protocolUserAccess)
                    .where(inArray(protocolUserAccess.endpointId, endpointIds))
                : [];
              const assignmentsByEndpoint = new Map<number, any[]>();
              for (const assignment of assignments as any[]) {
                const endpointId = positiveId(assignment?.endpointId);
                if (!endpointId) continue;
                const rows = assignmentsByEndpoint.get(endpointId) || [];
                rows.push(assignment);
                assignmentsByEndpoint.set(endpointId, rows);
              }
              const rulesById = new Map(rules.map((rule) => [positiveId(rule?.id), rule]));
              const trusted = new Set<number>();
              for (const endpoint of endpoints as any[]) {
                const ruleId = positiveId(endpoint?.forwardRuleId);
                const endpointId = positiveId(endpoint?.id);
                const rule = rulesById.get(ruleId);
                if (!rule || !endpointId) continue;
                if (isTrustedProtocolTrafficBridgeRuntimeRule({
                  rule,
                  endpoint,
                  assignments: assignmentsByEndpoint.get(endpointId) || [],
                })) trusted.add(ruleId);
              }
              return trusted;
            } catch (error) {
              warnLinkAccessLookupFailure(error);
              return new Set<number>();
            }
          }

          ''')
          replace_once("server/linkAccessView.ts", anchor, helper + anchor)
          replace_once(
              "server/linkAccessView.ts",
              "  const userRows = await db\n",
              "  const trustedBridgeRuleIds = await trustedProtocolTrafficBridgeRuleIds(db, rules);\n  const userRows = await db\n",
          )
          replace_once(
              "server/linkAccessView.ts",
              "  return rules.map((rule) => {\n    const userId = positiveId(rule?.userId);\n",
              "  return rules.map((rule) => {\n    if (trustedBridgeRuleIds.has(positiveId(rule?.id))) return rule;\n    const userId = positiveId(rule?.userId);\n",
          )

          replace_once(
              "server/protocolTrafficBridge.ts",
              "export function managedProtocolTrafficOwnerUserId(assignments: any[]) {\n",
              dedent('''\
              export function directManagedProtocolConfigAfterBridge(configValue: unknown, publicPort: unknown) {
                const config = withoutProtocolTrafficBridgeMarker(configValue) as ProtocolAccessConfig;
                const port = positiveInteger(publicPort);
                if (port > 0 && port <= 65535) config.listenPort = port;
                return config;
              }

              export function managedProtocolTrafficOwnerUserId(assignments: any[]) {
              '''),
          )
          replace_once(
              "server/protocolTrafficBridge.ts",
              "async function createOrReplaceOwnedBridge(endpoint: any, ownerUserId: number, marker: ProtocolTrafficBridgeMarker | null) {\n",
              dedent('''\
              async function restoreDirectManagedProtocolEndpoint(endpoint: any, marker: ProtocolTrafficBridgeMarker | null) {
                if (!marker) return false;
                const rule = await db.getForwardRuleById(marker.ruleId) as any;
                if (rule && !rule.pendingDelete) await db.markForwardRulePendingDelete(marker.ruleId);
                const config = directManagedProtocolConfigAfterBridge(endpoint?.configJson, endpoint?.publicPort);
                await db.updateProtocolEndpoint(positiveInteger(endpoint?.id), {
                  forwardRuleId: null,
                  configJson: config,
                } as any);
                return true;
              }

              async function createOrReplaceOwnedBridge(endpoint: any, ownerUserId: number, marker: ProtocolTrafficBridgeMarker | null) {
              '''),
          )
          replace_once(
              "server/protocolTrafficBridge.ts",
              "    if (!endpoint.isEnabled || ownerUserId <= 0 || !userCanReceiveProtocolTraffic(owner)) {\n      const changed = marker?.ruleId ? await disableOwnedBridgeRule(marker.ruleId) : false;\n      return { changed, hostId };\n    }\n",
              "    if (ownerUserId <= 0) {\n      const changed = marker ? await restoreDirectManagedProtocolEndpoint(endpoint, marker) : false;\n      return { changed, hostId };\n    }\n    if (!endpoint.isEnabled || !userCanReceiveProtocolTraffic(owner)) {\n      const changed = marker?.ruleId ? await disableOwnedBridgeRule(marker.ruleId) : false;\n      return { changed, hostId };\n    }\n",
          )

          replace_once(
              "server/protocolTrafficBridge.test.ts",
              "  managedProtocolTrafficBridgeMatches,\n",
              "  directManagedProtocolConfigAfterBridge,\n  managedProtocolTrafficBridgeMatches,\n",
          )
          replace_once(
              "server/protocolTrafficBridge.test.ts",
              '} from "./protocolTrafficBridge";\n',
              '} from "./protocolTrafficBridge";\nimport { isTrustedProtocolTrafficBridgeRuntimeRule } from "./protocolTrafficBridgeTrust";\n',
          )
          tests = dedent('''\

          test("trusted protocol bridge runtime rule requires marker and unique matching assignment", () => {
            const endpoint = {
              id: 3,
              runtimeMode: "managed",
              isEnabled: true,
              hostId: 5,
              forwardRuleId: 41,
              publicPort: 24001,
              configJson: JSON.stringify({
                listenPort: 25001,
                _forwardxTrafficBridge: {
                  version: 1,
                  managed: true,
                  ruleId: 41,
                  ownerUserId: 9,
                  publicPort: 24001,
                  listenPort: 25001,
                },
              }),
            };
            const rule = {
              id: 41,
              userId: 9,
              hostId: 5,
              sourcePort: 24001,
              targetIp: "127.0.0.1",
              targetPort: 25001,
              pendingDelete: false,
            };
            assert.equal(isTrustedProtocolTrafficBridgeRuntimeRule({
              rule,
              endpoint,
              assignments: [{ userId: 9, isEnabled: true }],
            }), true);
            assert.equal(isTrustedProtocolTrafficBridgeRuntimeRule({
              rule,
              endpoint,
              assignments: [{ userId: 10, isEnabled: true }],
            }), false);
            assert.equal(isTrustedProtocolTrafficBridgeRuntimeRule({
              rule,
              endpoint,
              assignments: [{ userId: 9, isEnabled: true }, { userId: 10, isEnabled: true }],
            }), false);
            assert.equal(isTrustedProtocolTrafficBridgeRuntimeRule({
              rule: { ...rule, targetPort: 25002 },
              endpoint,
              assignments: [{ userId: 9, isEnabled: true }],
            }), false);
          });

          test("restoring direct managed protocol config removes marker and restores public listen", () => {
            const config = directManagedProtocolConfigAfterBridge({
              listenPort: 25001,
              password: "secret",
              _forwardxTrafficBridge: {
                version: 1,
                managed: true,
                ruleId: 41,
                ownerUserId: 9,
                publicPort: 24001,
                listenPort: 25001,
              },
            }, 24001);
            assert.deepEqual(config, { listenPort: 24001, password: "secret" });
          });
          ''')
          with Path("server/protocolTrafficBridge.test.ts").open("a") as f:
              f.write(tests)

          Path(".github/workflows/protocol-bridge-hotfix-patch.yml").unlink()
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: allow trusted protocol traffic bridges at runtime"
          git push origin HEAD:fix/protocol-traffic-bridge-runtime-acl
